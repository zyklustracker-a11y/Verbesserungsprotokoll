    app.appendChild(ghSection);
    githubHomeRepaint = ()=>renderGithubHome(ghSection);
    githubHomeRepaint();

    app.appendChild(buildFooter());

    // Live-Projekte laden
    ensureLegacyProject();
    const q = query(projectsRef, orderBy('order','asc'));
    track(onSnapshot(q,(snap)=>{
      projectsCache = snap.docs.map(d=>({id:d.id, ...d.data()}));
      grid.innerHTML='';
      if(projectsCache.length===0){
        grid.appendChild(el('p',{class:'empty',text:'Noch keine Projekte – lege oben dein erstes an.'}));
      }
      projectsCache.forEach((p,i)=> grid.appendChild(buildProjectCard(p,i,projectsCache.length)));
      // Erst mit den Projekten steht fest, welche Repos noch keins haben
      githubHomeRepaint();
      statusDot.classList.remove('offline');
      statusText.textContent='Verbunden · Live-Synchronisierung aktiv';
      splashMelde('daten');   // Karten stehen – nichts ploppt mehr nach
    },(err)=>{
      console.error(err);
      statusDot.classList.add('offline');
      statusText.textContent=describeError(err);
      splashMelde('daten');
    }));
  }

  function buildProjectCard(p,index,total){
    const card = el('div',{class:'project-card'});
    card.style.borderLeftColor = p.color || '#c08552';
    card.addEventListener('click',(e)=>{
      if(e.target.closest('.card-controls')) return;
      location.hash = '#/project/'+encodeURIComponent(p.id);
    });

    card.appendChild(el('div',{class:'card-icon',text:p.icon||'📁'}));
    card.appendChild(el('p',{class:'card-name',text:p.name||'Ohne Namen'}));

    // Host als kleines Badge – nur wenn für das Projekt einer hinterlegt ist
    const hostTag = hostBadge(readHosting(p).host,{mini:true});
    if(hostTag) card.appendChild(hostTag);

    // Offene Aufgaben zählen. Bewusst eine serverseitige Aggregation statt
    // eines onSnapshot je Projekt: das wären dauerhaft offene Listener, die
    // jedes Dokument einzeln lesen – diese Abfrage kostet einen Bruchteil.
    // Aktuell genug, weil der Router die Startseite ohnehin neu zeichnet.
    // entriesRefFor() ist Pflicht, sonst zählt das Legacy-Projekt falsch.
    const count = el('p',{class:'card-count',text:'…'});   // Platzhalter statt 0,
    card.appendChild(count);                               // sonst blitzt eine falsche Zahl auf
    getCountFromServer(query(entriesRefFor(p), where('done','==',false)))
      .then(snap=>{
        if(!count.isConnected) return;      // Ansicht inzwischen gewechselt
        const n = snap.data().count;
        count.textContent = n===0 ? 'Keine offenen Aufgaben'
                          : (n===1 ? '1 offene Aufgabe übrig'
                                   : n+' offene Aufgaben übrig');
      })
      .catch(err=>{
        // Ein Zähler ist nicht kritisch – die Karte bleibt ohne ihn nutzbar.
        console.error(err);
        if(count.isConnected) count.textContent='';
      });

    const controls = el('div',{class:'card-controls'});
    controls.appendChild(el('button',{class:'ctrl-btn',title:'Nach oben',text:'▲',
      onclick:()=>moveProject(index,-1)}));
    controls.appendChild(el('button',{class:'ctrl-btn',title:'Nach unten',text:'▼',
      onclick:()=>moveProject(index,1)}));
    controls.appendChild(el('span',{class:'ctrl-spacer'}));
    controls.appendChild(el('button',{class:'ctrl-btn',title:'Bearbeiten / Umbenennen',text:'✎',
      onclick:()=>openProjectModal(p)}));
    controls.appendChild(el('button',{class:'ctrl-btn danger',title:'Löschen',text:'🗑',
      onclick:()=>deleteProject(p)}));
    card.appendChild(controls);
    return card;
  }

  async function moveProject(index,dir){
    const target = index+dir;
    if(target<0 || target>=projectsCache.length) return;
    const a = projectsCache[index], b = projectsCache[target];
    const oa = (a.order ?? index), ob = (b.order ?? target);
    try{
      const batch = writeBatch(db);
      batch.update(doc(db,'projects',a.id),{order:ob});
      batch.update(doc(db,'projects',b.id),{order:oa});
      await batch.commit();
    }catch(err){ console.error(err); alert('Reihenfolge konnte nicht geändert werden.'); }
  }

  async function deleteProject(p){
    if(p.legacyCollection){
      if(!confirm('„'+p.name+'“ ist dein ursprüngliches Verbesserungsprotokoll mit allen bestehenden Einträgen.\n\nWirklich löschen? Die Einträge selbst bleiben in der Datenbank erhalten, das Projekt verschwindet aber aus der Übersicht.')) return;
    } else {
      if(!confirm('Projekt „'+p.name+'“ mit allen zugehörigen Einträgen unwiderruflich löschen?')) return;
    }
    try{
      if(!p.legacyCollection){
        const es = await getDocs(collection(db,'projects',p.id,'entries'));
        const batch = writeBatch(db);
        es.forEach(d=>batch.delete(d.ref));
        await batch.commit();
      }
      await deleteDoc(doc(db,'projects',p.id));
    }catch(err){ console.error(err); alert('Projekt konnte nicht gelöscht werden.'); }
  }

  // ── Projekt anlegen / bearbeiten (Modal) ──────────────────
  function openProjectModal(existing){
    const isEdit = !!existing;
    let selColor = existing?.color || COLORS[0];
    let selIcon  = existing?.icon  || ICONS[0];

    const nameInput = el('input',{type:'text',placeholder:'z. B. Fitness-App',value:existing?.name||'',maxlength:'80'});

    const swatchGrid = el('div',{class:'swatch-grid'});
    COLORS.forEach(c=>{
      const s = el('div',{class:'swatch'+(c===selColor?' sel':'')});
      s.style.background=c;
      s.addEventListener('click',()=>{ selColor=c; swatchGrid.querySelectorAll('.swatch').forEach(x=>x.classList.remove('sel')); s.classList.add('sel'); });
      swatchGrid.appendChild(s);
    });

    const iconGrid = el('div',{class:'icon-grid'});
    ICONS.forEach(ic=>{
      const o = el('div',{class:'icon-opt'+(ic===selIcon?' sel':''),text:ic});
      o.addEventListener('click',()=>{ selIcon=ic; iconGrid.querySelectorAll('.icon-opt').forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); });
      iconGrid.appendChild(o);
    });

    const overlay = el('div',{class:'modal-overlay'});
    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
    const saveBtn = el('button',{class:'btn',text:isEdit?'Speichern':'Anlegen'});

    const modal = el('div',{class:'modal'},[
      el('h2',{text:isEdit?'Projekt bearbeiten':'Neues Projekt'}),
      el('div',{class:'field'},[el('label',{text:'Name'}),nameInput]),
      el('div',{class:'field'},[el('label',{text:'Farbe (optional)'}),swatchGrid]),
      el('div',{class:'field'},[el('label',{text:'Icon (optional)'}),iconGrid]),
      el('div',{class:'modal-actions'},[
        el('button',{class:'btn ghost',text:'Abbrechen',onclick:()=>overlay.remove()}),
        saveBtn
      ])
    ]);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    nameInput.focus();

    async function save(){
      const name = nameInput.value.trim();
      if(!name){ nameInput.focus(); return; }
      saveBtn.disabled=true;
      try{
        if(isEdit){
          await updateDoc(doc(db,'projects',existing.id),{name,color:selColor,icon:selIcon});
        }else{
          const maxOrder = projectsCache.reduce((m,p)=>Math.max(m,p.order??0),0);
          await addDoc(projectsRef,{name,color:selColor,icon:selIcon,order:maxOrder+1,createdAt:serverTimestamp()});
        }
        overlay.remove();
      }catch(err){ console.error(err); alert('Projekt konnte nicht gespeichert werden.'); saveBtn.disabled=false; }
    }
    saveBtn.addEventListener('click',save);
    nameInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); save(); }});
  }

  // ══════════════════════════════════════════════════════════
  //  HOSTING · Datenmodell, GitHub-Erkennung, Anzeige
  // ══════════════════════════════════════════════════════════

  // Alle Felder sind optional. Projekte ohne hosting-Feld (also der komplette
  // Altbestand) laufen unverändert weiter – gelesen wird ausschliesslich über
  // readHosting(), das jeden fehlenden Wert zu '' normalisiert. Es gibt daher
  // bewusst KEINE Migration.
  const HOSTING_FIELDS = ['host','liveUrl','repoUrl','dashboardUrl','deployNote'];

  // Eigener GitHub-Konto-Name. Wird ergänzt, wenn in der Repo-Angabe nur der
  // Repo-Name ohne Schrägstrich steht – dann genügt „mein-repo“ statt
  // „zyklustracker-a11y/mein-repo“. Bei einem Kontowechsel hier ändern.
  const GITHUB_OWNER = 'zyklustracker-a11y';

  // Reihenfolge = Priorität: die erste passende Konfigurationsdatei gewinnt.
  const HOST_SIGNATURES = [
    { host:'Netlify',            files:['netlify.toml'] },
    { host:'Vercel',             files:['vercel.json','.vercel'] },
    { host:'Render',             files:['render.yaml'] },
    { host:'Fly.io',             files:['fly.toml'] },
    { host:'Firebase',           files:['firebase.json'] },
    { host:'Railway',            files:['railway.json','railway.toml'] },
    { host:'Cloudflare Pages',   files:['wrangler.toml'] },
    { host:'Eigener Server/VPS', files:['Dockerfile','docker-compose.yml'] }
  ];

  // Bekannte Hosts bekommen eine eigene Badge-Farbe (siehe --host-* in :root),
  // alles andere – auch selbst eingetippte Namen – wird neutral dargestellt.
  const HOST_CLASSES = {
    'netlify':'netlify',
    'vercel':'vercel',
    'render':'render',
    'fly.io':'fly',
    'firebase':'firebase',
    'railway':'railway',
    'cloudflare pages':'cloudflare',
    'github pages':'ghpages',
    'eigener server/vps':'vps'
  };

  // Defensiv lesen: liefert immer ein vollständiges Objekt mit Strings.
  function readHosting(project){
    const raw = (project && project.hosting && typeof project.hosting==='object' && !Array.isArray(project.hosting))
      ? project.hosting : {};
    const out = {};
    HOSTING_FIELDS.forEach(k=>{ out[k] = typeof raw[k]==='string' ? raw[k].trim() : ''; });
    out.updatedAt = raw.updatedAt || null;
    return out;
  }
  function hostingIsEmpty(h){ return HOSTING_FIELDS.every(k=>!h[k]); }

  // Links kommen aus Eingabefeldern, deshalb hier absichern: nur http(s) wird
  // verlinkt, alles ohne Schema bekommt https:// davor (Tippkomfort),
  // javascript:/data: o. Ä. werden verworfen.
  function normalizeUrl(value){
    const s = String(value||'').trim();
    if(!s) return '';
    if(/^https?:\/\//i.test(s)) return s;
    if(/^[a-z][a-z0-9+.-]*:/i.test(s)) return '';   // fremdes Schema → nicht verlinken
    if(/^\/\//.test(s)) return 'https:'+s;
    return 'https://'+s;
  }

  function hostBadge(host,opts={}){
    const name = String(host||'').trim();
    if(!name) return null;
    const cls = HOST_CLASSES[name.toLowerCase()] || 'neutral';
    return el('span',{class:'host-badge '+cls+(opts.mini?' mini':''),text:name});
  }

  // ── Repo-Angabe zerlegen ──────────────────────────────────
  // Akzeptiert:  https://github.com/owner/repo(.git)  ·  git@github.com:owner/repo.git
  //              owner/repo  ·  URLs mit /tree/... oder Schrägstrich am Ende
  //              sowie „repo“ allein – dann wird GITHUB_OWNER ergänzt.
  function parseRepoInput(value){
    let s = String(value||'').trim();
    if(!s) return null;
    s = s.replace(/^git\+/i,'').replace(/\/+$/,'');
    // Kurzform ohne Schrägstrich: nur der Repo-Name
    if(GITHUB_OWNER && /^[\w.-]+$/.test(s)){
      const short = s.replace(/\.git$/i,'');
      if(short) return {owner:GITHUB_OWNER, repo:short};
    }
    let m = s.match(/^git@github\.com:([^/]+)\/(.+)$/i)
         || s.match(/^(?:ssh:\/\/)?git@github\.com\/([^/]+)\/(.+)$/i)
         || s.match(/^(?:https?:\/\/)?(?:www\.)?github\.com\/([^/]+)\/([^/?#]+)/i)
         || s.match(/^([^/\s]+)\/([^/\s?#]+)$/);
    if(!m) return null;
    const owner = m[1].trim();
    const repo  = m[2].split(/[/?#]/)[0].replace(/\.git$/i,'').trim();
    // GitHub erlaubt in Namen nur Buchstaben, Ziffern, . _ und -
    if(!/^[\w.-]+$/.test(owner) || !/^[\w.-]+$/.test(repo)) return null;
    return {owner,repo};
  }

  // ── GitHub-Token ──────────────────────────────────────────
  // Optional. Ohne Token funktioniert alles wie bisher, nur eben ausschliesslich
  // mit öffentlichen Repos und 60 Abfragen pro Stunde. Mit Token kommen private
  // Repos, die Repo-Auswahlliste und 5000 Abfragen pro Stunde dazu.
  //
  // Ablage: settings/github. Bewusst eine eigene Collection, weil backup.html
  // nur projects/appIdeas/todos/verbesserungsprotokoll sichert – so landet der
  // Token nicht in heruntergeladenen Backup-Dateien.
  const GITHUB_SETTINGS_DOC = ['settings','github'];
  let githubToken = '';       // im Speicher, solange die Seite offen ist
  let githubLogin = '';       // Konto-Name laut Token, nur zur Anzeige

  function githubSettingsRef(){ return doc(db,GITHUB_SETTINGS_DOC[0],GITHUB_SETTINGS_DOC[1]); }

  // Beim Start einmal laden. Fehler sind hier unkritisch: dann bleibt die App
  // im Zustand „kein Token“ und meldet das erst, wenn es jemand braucht.
  async function loadGithubToken(){
    try{
      const snap = await getDoc(githubSettingsRef());
      if(snap.exists()){
        const d = snap.data() || {};
        githubToken = typeof d.token==='string' ? d.token.trim() : '';
        githubLogin = typeof d.login==='string' ? d.login.trim() : '';
      }
    }catch(err){
      // Fehlt der Rules-Block für settings, landet man genau hier.
      console.warn('GitHub-Einstellungen nicht lesbar:',err);
    }
  }

  async function saveGithubToken(token,login){
    await setDoc(githubSettingsRef(),{
      token:token, login:login||'', updatedAt:serverTimestamp()
    });
    githubToken = token; githubLogin = login||'';
  }
  async function clearGithubToken(){
    await setDoc(githubSettingsRef(),{token:'', login:'', updatedAt:serverTimestamp()});
    githubToken=''; githubLogin='';
  }
  function hasGithubToken(){ return !!githubToken; }

  // ── GitHub-API ────────────────────────────────────────────
  // Fehler werden hier schon in verständliche deutsche Sätze übersetzt,
  // damit die Dialoge sie nur noch anzeigen müssen.
  // token: '' erzwingt einen Aufruf ohne Anmeldung, undefined nimmt den
  // gespeicherten Token (falls vorhanden).
  async function githubGet(url,token){
    const auth = (token===undefined) ? githubToken : token;
    const headers = {'Accept':'application/vnd.github+json'};
    if(auth) headers['Authorization'] = 'Bearer '+auth;
    let res;
    try{
      res = await fetch(url,{headers});
    }catch(err){
      throw new Error('Keine Verbindung zu GitHub – Internetverbindung prüfen und noch einmal versuchen.');
    }
    if(res.status===401)
      throw new Error('Der GitHub-Token wird nicht akzeptiert – er ist ungültig, abgelaufen oder widerrufen.');
    if(res.status===404)
      throw new Error(auth
        ? 'Repo nicht gefunden – Name prüfen. Liegt es in einem anderen Konto oder deckt der Token es nicht ab, fehlt dem Token der Zugriff.'
        : 'Repo nicht gefunden oder privat.');
    if(res.status===403 || res.status===429)
      throw new Error(auth
        ? 'GitHub-Limit erreicht (5000 Abfragen pro Stunde), bitte später nochmal.'
        : 'GitHub-Limit erreicht (60 Abfragen pro Stunde), bitte später nochmal.');
    if(!res.ok) throw new Error('GitHub antwortet mit Fehler '+res.status+' – bitte später nochmal versuchen.');
    try{ return await res.json(); }
    catch(err){ throw new Error('Die Antwort von GitHub war unlesbar – bitte später nochmal versuchen.'); }
  }

  // Prüft einen Token und liefert den Konto-Namen zurück.
  async function verifyGithubToken(token){
    const me = await githubGet('https://api.github.com/user',token);
    const login = (me && typeof me.login==='string') ? me.login : '';
    if(!login) throw new Error('GitHub hat keinen Konto-Namen zurückgegeben – Token bitte prüfen.');
    return login;
  }

  // Eigene Repos, neueste Änderung zuerst. Braucht einen Token, weil ohne
  // Anmeldung keine privaten Repos sichtbar sind.
  async function fetchMyRepos(){
    if(!hasGithubToken()) throw new Error('Dafür wird ein GitHub-Token benötigt.');
    const out = [];
    // Bis zu drei Seiten – 300 Repos sind für den Zweck reichlich.
    for(let page=1; page<=3; page++){
      const list = await githubGet('https://api.github.com/user/repos'+
        '?per_page=100&sort=pushed&affiliation=owner&page='+page);
      if(!Array.isArray(list) || list.length===0) break;
      list.forEach(r=>{
        if(!r || typeof r.full_name!=='string') return;
        out.push({
          fullName:r.full_name,
          name:typeof r.name==='string' ? r.name : r.full_name,
          isPrivate:r.private===true,
          htmlUrl:typeof r.html_url==='string' ? r.html_url : ''
        });
      });
      if(list.length<100) break;
    }
    return out;
  }

  async function detectHosting(owner,repo){
    const base = 'https://api.github.com/repos/'+encodeURIComponent(owner)+'/'+encodeURIComponent(repo);
    const meta = await githubGet(base);

    const result = {
      host:'',
      liveUrl: (typeof meta.homepage==='string' && meta.homepage.trim()) ? meta.homepage.trim() : '',
      repoUrl: (typeof meta.html_url==='string' && meta.html_url) ? meta.html_url : 'https://github.com/'+owner+'/'+repo,
      dashboardUrl:'',
      deployNote:''
    };
    const notes = [];
    if(meta.default_branch) notes.push('Default-Branch: '+meta.default_branch);

    // Root-Dateien lesen. Schlägt nur dieser Teil fehl, bleiben die Daten aus
    // dem ersten Aufruf trotzdem erhalten – der Host wird dann eben leer.
    let files = [], listError = '';
    try{
      const contents = await githubGet(base+'/contents/');
      if(Array.isArray(contents)) files = contents.map(f=>String((f && f.name) || '').toLowerCase());
    }catch(err){ listError = err.message; }

    const hits = [];
    HOST_SIGNATURES.forEach(sig=>{
      const found = sig.files.find(name=>files.includes(name.toLowerCase()));
      if(found) hits.push({host:sig.host, file:found});
    });

    if(hits.length){
      result.host = hits[0].host;
      notes.push(hits[0].file+' im Root gefunden');
      if(hits.length>1){
        notes.push('mehrere Konfigurationen gefunden ('+hits.map(h=>h.file).join(', ')+
                   ') – „'+hits[0].host+'“ als wahrscheinlichster Host gewählt, bitte prüfen');
      }
    } else if(meta.has_pages===true){
      result.host = 'GitHub Pages';
      // Einziger Fall mit sinnvoll ableitbarem Dashboard – überall sonst steckt
      // dort eine interne Projekt-ID, die nicht im Repo steht. Nichts raten.
      result.dashboardUrl = 'https://github.com/'+owner+'/'+repo+'/settings/pages';
      notes.push('GitHub Pages ist für das Repo aktiv');
      if(!result.liveUrl){
        result.liveUrl = repo.toLowerCase()===(owner+'.github.io').toLowerCase()
          ? 'https://'+owner+'.github.io'
          : 'https://'+owner+'.github.io/'+repo;
      }
    } else if(listError){
      notes.push('Dateien im Root nicht lesbar ('+listError+')');
    } else {
      notes.push('keine bekannte Hosting-Konfiguration im Root gefunden');
    }

    result.deployNote = notes.join(' · ');
    return result;
  }

  // ── Dialog: GitHub-Token verbinden ────────────────────────
  function openGithubTokenModal(onDone){
    const tokenInput = el('input',{type:'password',placeholder:'github_pat_… hier einfügen',
      autocapitalize:'off',autocorrect:'off',spellcheck:'false',autocomplete:'off'});
    const status = el('p',{class:'hg-status',text:'Der Token wird vor dem Speichern bei GitHub geprüft.'});
    const saveBtn = el('button',{class:'btn',type:'button',text:'Prüfen und speichern'});

    function setStatus(msg,kind){
      status.className='hg-status'+(kind?' '+kind:'');
      status.textContent=msg;
    }

    const stateLine = el('div',{class:'gh-state'});
    function paintState(){
      stateLine.innerHTML='';
      if(hasGithubToken()){
        stateLine.appendChild(el('span',{class:'host-badge vps',text:'verbunden'}));
        stateLine.appendChild(el('span',{class:'hg-sub',style:'margin:0;',
          text:githubLogin ? ('als '+githubLogin) : ''}));
      }else{
        stateLine.appendChild(el('span',{class:'host-badge neutral',text:'nicht verbunden'}));
      }
    }
    paintState();

    const overlay = el('div',{class:'modal-overlay'});
    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });

    const removeBtn = el('button',{class:'btn ghost',type:'button',text:'Token entfernen'});
    removeBtn.addEventListener('click',async()=>{
      if(!confirm('GitHub-Token entfernen? Private Repos und die Repo-Liste stehen danach nicht mehr zur Verfügung.')) return;
      removeBtn.disabled=true;
      try{
        await clearGithubToken();
        paintState();
        setStatus('Token entfernt. Öffentliche Repos werden weiterhin erkannt.','ok');
        if(typeof onDone==='function') onDone();
      }catch(err){
        console.error(err); setStatus(describeError(err),'err');
      }
      removeBtn.disabled=false;
    });

    async function save(){
      const token = tokenInput.value.trim();
      if(!token){ setStatus('Bitte den Token einfügen.','err'); tokenInput.focus(); return; }
      saveBtn.disabled=true;
      setStatus('Token wird bei GitHub geprüft …');
      let login;
      try{
        login = await verifyGithubToken(token);
      }catch(err){
        console.error(err); setStatus(err.message,'err'); saveBtn.disabled=false; return;
      }
      try{
        await saveGithubToken(token,login);
        tokenInput.value='';
        paintState();
        setStatus('Verbunden als '+login+'. Deine Repos stehen jetzt als Liste bereit.','ok');
        if(typeof onDone==='function') onDone();
      }catch(err){
        console.error(err);
        // Häufigster Fall: der settings-Block fehlt noch in den Firestore-Regeln.
        setStatus(describeError(err)+' Fehlt in den Firestore-Regeln der Block für „settings“, '+
                  'muss er in der Firebase Console noch eingespielt werden.','err');
      }
      saveBtn.disabled=false;
    }
    saveBtn.addEventListener('click',save);
    tokenInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); save(); }});

    const modal = el('div',{class:'modal wide'},[
      el('h2',{text:'GitHub verbinden'}),
      stateLine,
      el('p',{class:'hg-hint',text:'Mit einem Token erkennt die App auch private Repos, '+
        'zeigt deine Repos als Auswahlliste und darf 5000 statt 60 Abfragen pro Stunde machen. '+
        'Der Token ist kostenlos und braucht keine Zahlungsdaten.'}),
      el('ol',{class:'gh-steps',html:
        '<li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">Diese GitHub-Seite öffnen</a> (Fine-grained token).</li>'+
        '<li>Namen vergeben, z. B. <code>Verbesserungsprotokoll</code>, und eine Laufzeit wählen.</li>'+
        '<li>Bei <strong>Repository access</strong>: <code>All repositories</code>.</li>'+
        '<li>Bei <strong>Permissions → Repository permissions</strong> genau zwei auf <code>Read-only</code> setzen: '+
        '<strong>Metadata</strong> und <strong>Contents</strong>. Sonst nichts – Schreibrechte braucht die App nicht.</li>'+
        '<li>Token erzeugen, kopieren und unten einfügen. GitHub zeigt ihn nur einmal.</li>'}),
      el('div',{class:'field'},[
        el('label',{text:'Token'}),
        tokenInput,
        el('p',{class:'hg-sub',text:'Wird in deiner Datenbank gespeichert und ist nur für dein Konto lesbar. '+
          'In heruntergeladenen Backups ist er nicht enthalten. Bei GitHub kannst du ihn jederzeit widerrufen.'})
      ]),
      status,
      el('div',{class:'modal-actions'},[
        el('button',{class:'btn ghost',type:'button',text:'Schliessen',onclick:()=>overlay.remove()}),
        hasGithubToken() ? removeBtn : null,
        saveBtn
      ].filter(Boolean))
    ]);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    tokenInput.focus();
  }

  // ── Repo-Auswahlliste ─────────────────────────────────────
  // Baut eine gefilterte, scrollbare Liste. onPick(repo) beim Antippen.
  // markFn(repo) darf optional einen Hinweistext für die rechte Seite liefern.
  function buildRepoPicker(repos,onPick,markFn){
    const filter = el('input',{class:'rp-filter',type:'text',placeholder:'Suchen …',
      autocapitalize:'off',autocorrect:'off',spellcheck:'false'});
    const list = el('div',{class:'rp-list'});
    const count = el('p',{class:'hg-sub',text:''});

    function paint(){
      const q = filter.value.trim().toLowerCase();
      const shown = repos.filter(r=> !q || r.fullName.toLowerCase().includes(q));
      list.innerHTML='';
      if(shown.length===0){
        list.appendChild(el('p',{class:'empty',style:'padding:18px 15px;',text:'Kein Repo gefunden.'}));
      }else{
        shown.forEach(r=>{
          const tags = [];
          if(r.isPrivate) tags.push(el('span',{class:'rp-tag privat',text:'privat'}));
          const mark = markFn ? markFn(r) : '';
          if(mark) tags.push(el('span',{class:'rp-tag hat',text:mark}));
          list.appendChild(el('button',{class:'rp-row',type:'button',
            onclick:()=>onPick(r)},[el('span',{class:'rp-name',text:r.name})].concat(tags)));
        });
      }
      count.textContent = shown.length+' von '+repos.length+' Repos';
    }
    filter.addEventListener('input',paint);
    paint();
    return el('div',{},[filter,list,count]);
  }

  // ── JSON-Fallback ─────────────────────────────────────────
  // Schneidet das erste vollständige JSON-Objekt heraus; Code-Fences und
  // Fliesstext drumherum stören dadurch nicht.
  function extractJsonObject(text){
    const s = String(text||'');
    const start = s.indexOf('{');
    if(start<0) return '';
    let depth=0, inStr=false, esc=false;
    for(let i=start;i<s.length;i++){
      const c = s[i];
      if(inStr){
        if(esc) esc=false;
        else if(c==='\\') esc=true;
        else if(c==='"') inStr=false;
        continue;
      }
      if(c==='"') inStr=true;
      else if(c==='{') depth++;
      else if(c==='}'){ depth--; if(depth===0) return s.slice(start,i+1); }
    }
    return '';
  }

  function parseHostingJson(text){
    if(!String(text||'').trim()) throw new Error('Es wurde noch kein JSON eingefügt.');
    const block = extractJsonObject(text);
    if(!block) throw new Error('Kein JSON-Objekt gefunden – erwartet wird ein Block mit geschweiften Klammern.');
    let data;
    try{ data = JSON.parse(block); }
    catch(err){ throw new Error('Das JSON konnte nicht gelesen werden – bitte den Block noch einmal prüfen.'); }
    if(!data || typeof data!=='object' || Array.isArray(data))
      throw new Error('Erwartet wird ein JSON-Objekt mit den Hosting-Feldern.');

    // Sowohl { "host": … } als auch { "hosting": { "host": … } } akzeptieren.
    const src = (data.hosting && typeof data.hosting==='object' && !Array.isArray(data.hosting)) ? data.hosting : data;
    const out = {}; let any = false;
    HOSTING_FIELDS.forEach(k=>{                 // unbekannte Felder werden ignoriert
      const v = src[k];
      out[k] = (typeof v==='string' || typeof v==='number') ? String(v).trim() : '';
      if(out[k]) any = true;
    });
    if(!any) throw new Error('Im JSON war keines der Felder host, liveUrl, repoUrl, dashboardUrl oder deployNote gefüllt.');
    return out;
  }

  // ── Dialog: erkennen, prüfen, speichern ───────────────────
  // onSaved() wird nach erfolgreichem Schreiben aufgerufen, damit der Aufrufer
  // seine Anzeige neu zeichnen kann.
  function openHostingModal(project,onSaved){
    const current = readHosting(project);

    // Noch nichts hinterlegt? Dann den Projektnamen vorschlagen – Projekt und
    // Repo heissen meistens gleich, und GitHub sucht ohne Rücksicht auf Gross-
    // und Kleinschreibung. Nur wenn der Name als Repo-Name durchgehen kann.
    const nameGuess = (!current.repoUrl && /^[\w.-]+$/.test(String(project.name||'').trim()))
      ? String(project.name).trim() : '';
    const repoInput = el('input',{type:'text',placeholder:'z. B. mein-repo',
      value:current.repoUrl||nameGuess,autocapitalize:'off',autocorrect:'off',spellcheck:'false'});
    const detectBtn = el('button',{class:'btn',type:'button',text:'Erkennen'});
    const status = el('p',{class:'hg-status',text: nameGuess
      ? ('Vorgeschlagen ist der Projektname. Passt er nicht, überschreiben – dann „Erkennen“ drücken.')
      : 'Repo eintragen und „Erkennen“ drücken – oder die Felder unten direkt selbst ausfüllen.'});

    // Vorschau: alle Felder editierbar, damit sich jedes Ergebnis korrigieren lässt.
    const inputs = {
      host:         el('input',{type:'text',placeholder:'z. B. Netlify – eigener Name ist auch möglich',value:current.host,maxlength:'60'}),
      liveUrl:      el('input',{type:'text',placeholder:'https://…',value:current.liveUrl,autocapitalize:'off',autocorrect:'off',spellcheck:'false'}),
      repoUrl:      el('input',{type:'text',placeholder:'https://github.com/…',value:current.repoUrl,autocapitalize:'off',autocorrect:'off',spellcheck:'false'}),
      dashboardUrl: el('input',{type:'text',placeholder:'Optional – z. B. Netlify-Projektseite',value:current.dashboardUrl,autocapitalize:'off',autocorrect:'off',spellcheck:'false'}),
      deployNote:   el('textarea',{placeholder:'Kurze Notiz zum Deployment',rows:'2',maxlength:'500'})
    };
    inputs.deployNote.value = current.deployNote;

    function fillPreview(data){
      HOSTING_FIELDS.forEach(k=>{ inputs[k].value = data[k] || ''; });
    }
    function setStatus(msg,kind){
      status.className = 'hg-status'+(kind?' '+kind:'');
      status.textContent = msg;
    }

    async function runDetect(){
      const parsed = parseRepoInput(repoInput.value);
      if(!parsed){
        // Auch hier bleibt das Formular editierbar – manuell weitermachen geht immer.
        setStatus('Die Repo-Angabe wurde nicht verstanden. Möglich sind z. B. nur der Repo-Name, '+
                  'owner/repo, https://github.com/owner/repo oder git@github.com:owner/repo.git','err');
        repoInput.focus();
        return;
      }
      detectBtn.disabled = true;
      setStatus('Frage GitHub nach '+parsed.owner+'/'+parsed.repo+' …');
      try{
        const data = await detectHosting(parsed.owner,parsed.repo);
        fillPreview(data);
        setStatus(data.host
          ? ('Erkannt: '+data.host+'. Bitte unten prüfen und bei Bedarf korrigieren.')
          : 'Kein bekannter Host erkannt – Repo-Link ist eingetragen, den Host bitte selbst ergänzen.',
          data.host ? 'ok' : null);
      }catch(err){
        console.error(err);
        // Fehlerfall: Felder bleiben stehen, nur der Repo-Link wird vorbelegt.
        if(!inputs.repoUrl.value) inputs.repoUrl.value = 'https://github.com/'+parsed.owner+'/'+parsed.repo;
        setStatus(err.message+' Die Felder unten lassen sich trotzdem von Hand ausfüllen.','err');
      }
      detectBtn.disabled = false;
    }
    detectBtn.addEventListener('click',runDetect);
    repoInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); runDetect(); }});

    // Repo-Auswahlliste: erspart das Tippen ganz und zeigt auch private Repos.
    const pickerBox = el('div',{style:'margin-top:12px;'});
    const pickBtn = el('button',{class:'pill-btn host-link',type:'button',text:'Aus meinen Repos wählen'});
    let pickerOpen = false;

    function closePicker(){ pickerOpen=false; pickerBox.innerHTML=''; pickBtn.textContent='Aus meinen Repos wählen'; }

    async function togglePicker(){
      if(pickerOpen){ closePicker(); return; }
      if(!hasGithubToken()){
        // Ohne Token gibt es keine Liste – direkt in den Verbinden-Dialog.
        openGithubTokenModal(()=>{ if(hasGithubToken()) togglePicker(); });
        return;
      }
      pickerOpen = true;
      pickBtn.textContent = 'Liste schliessen';
      pickerBox.innerHTML='';
      pickerBox.appendChild(el('p',{class:'hg-sub',text:'Repos werden geladen …'}));
      try{
        const repos = await fetchMyRepos();
        if(!pickerOpen) return;                   // zwischenzeitlich geschlossen
        pickerBox.innerHTML='';
        if(repos.length===0){
          pickerBox.appendChild(el('p',{class:'hg-sub',text:'Der Token sieht keine Repos. Deckt er auch „All repositories“ ab?'}));
          return;
        }
        pickerBox.appendChild(buildRepoPicker(repos,(r)=>{
          repoInput.value = r.fullName;
          closePicker();
          runDetect();
        }));
      }catch(err){
        console.error(err);
        if(!pickerOpen) return;
        pickerBox.innerHTML='';
        pickerBox.appendChild(el('p',{class:'hg-status err',text:err.message}));
      }
    }
    pickBtn.addEventListener('click',togglePicker);

    // JSON-Fallback (eingeklappt)
    const jsonArea = el('textarea',{placeholder:'JSON-Block hier einfügen – Text oder ```-Zeilen drumherum sind egal.',rows:'6'});
    const jsonBtn  = el('button',{class:'btn small ghost',type:'button',text:'JSON übernehmen'});
    const jsonMsg  = el('p',{class:'hg-status',style:'margin-top:12px;',text:'Erwartet werden die Felder host, liveUrl, repoUrl, dashboardUrl und deployNote. Unbekannte Felder werden ignoriert.'});
    jsonBtn.addEventListener('click',()=>{
      try{
        fillPreview(parseHostingJson(jsonArea.value));
        jsonMsg.className='hg-status ok';
        jsonMsg.textContent='Übernommen – bitte oben in der Vorschau prüfen und dann speichern.';
        setStatus('Werte aus dem eingefügten JSON übernommen.','ok');
      }catch(err){
        jsonMsg.className='hg-status err';
        jsonMsg.textContent=err.message;
      }
    });
    const jsonBox = el('details',{class:'hg-json'},[
      el('summary',{text:'JSON einfügen'}),
      jsonArea,
      el('div',{style:'margin-top:12px;'},[jsonBtn]),
      jsonMsg
    ]);

    const overlay = el('div',{class:'modal-overlay'});
    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
    const saveBtn = el('button',{class:'btn',type:'button',text:'Speichern'});

    const modal = el('div',{class:'modal wide'},[
      el('h2',{text:'Hosting'}),
      el('p',{class:'hg-hint',text:'Die Angaben werden direkt aus GitHub gelesen. Alles bleibt änderbar – gespeichert wird erst mit „Speichern“.'
        + (current.updatedAt ? ' Zuletzt aktualisiert: '+fmtDate(current.updatedAt)+'.' : '')}),
      el('div',{class:'field'},[
        el('label',{text:'GitHub-Repo'}),
        el('div',{class:'hg-detect-row'},[repoInput,detectBtn]),
        el('p',{class:'hg-sub',text: GITHUB_OWNER
          ? ('Der Repo-Name genügt – „'+GITHUB_OWNER+'/“ wird ergänzt. Eine vollständige URL geht auch.')
          : 'Möglich sind owner/repo oder eine vollständige GitHub-URL.'}),
        el('div',{style:'margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;'},[
          pickBtn,
          el('button',{class:'pill-btn host-link',type:'button',
            text: hasGithubToken() ? 'GitHub-Token ändern' : 'GitHub verbinden',
            onclick:()=>openGithubTokenModal(()=>{ closePicker(); })})
        ]),
        pickerBox
      ]),
      status,
      el('div',{class:'hg-section'},[
        el('p',{class:'section-label',text:'Vorschau'}),
        el('div',{class:'field'},[el('label',{text:'Host'}),inputs.host]),
        el('div',{class:'field'},[el('label',{text:'Live-URL'}),inputs.liveUrl]),
        el('div',{class:'field'},[el('label',{text:'Repo-URL'}),inputs.repoUrl]),
        el('div',{class:'field'},[el('label',{text:'Dashboard-URL'}),inputs.dashboardUrl]),
        el('div',{class:'field'},[el('label',{text:'Deploy-Notiz'}),inputs.deployNote])
      ]),
      jsonBox,
      el('div',{class:'modal-actions'},[
        el('button',{class:'btn ghost',type:'button',text:'Abbrechen',onclick:()=>overlay.remove()}),
        saveBtn
      ])
    ]);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    repoInput.focus();

    async function save(){
      const hosting = {};
      HOSTING_FIELDS.forEach(k=>{ hosting[k] = String(inputs[k].value||'').trim(); });
      ['liveUrl','repoUrl','dashboardUrl'].forEach(k=>{ hosting[k] = normalizeUrl(hosting[k]); });
      saveBtn.disabled = true;
      try{
        await updateDoc(doc(db,'projects',project.id),{
          hosting: Object.assign({},hosting,{updatedAt:serverTimestamp()})
        });
        // Lokale Kopie nachziehen: die Projektansicht lädt das Dokument einmalig
        // per getDoc, ein Snapshot-Listener korrigiert hier also nichts.
        project.hosting = Object.assign({},hosting,{updatedAt:new Date()});
        overlay.remove();
        if(typeof onSaved==='function') onSaved();
      }catch(err){
        console.error(err);
        setStatus(describeError(err),'err');
        saveBtn.disabled = false;
      }
    }
    saveBtn.addEventListener('click',save);
  }

  // ── Startseite: Repos ohne Projekt ────────────────────────
  let myReposCache = null;      // einmal pro Sitzung laden, spart Abfragen

  async function getMyRepos(force){
    if(!force && myReposCache) return myReposCache;
    myReposCache = await fetchMyRepos();
    return myReposCache;
  }

  // „owner/repo“ aller Projekte, die schon ein Repo hinterlegt haben
  function linkedRepoKeys(){
    const keys = new Set();
    projectsCache.forEach(p=>{
      const url = readHosting(p).repoUrl;
      if(!url) return;
      const parsed = parseRepoInput(url);
      if(parsed) keys.add((parsed.owner+'/'+parsed.repo).toLowerCase());
    });
    return keys;
  }

  // Legt aus einem Repo direkt ein Projekt an und erkennt das Hosting mit.
  // Das Projekt wird zuerst geschrieben, damit es auch dann existiert, wenn
  // die GitHub-Abfrage danach scheitert.
  async function createProjectFromRepo(repo){
    const parsed = parseRepoInput(repo.fullName);
    if(!parsed){ alert('Der Repo-Name konnte nicht gelesen werden.'); githubHomeRepaint(); return; }
    try{
      const maxOrder = projectsCache.reduce((m,p)=>Math.max(m,p.order??0),0);
      const ref = await addDoc(projectsRef,{
        name:repo.name,
        color:COLORS[projectsCache.length % COLORS.length],
        icon:'🌐',
        order:maxOrder+1,
        createdAt:serverTimestamp()
      });
      let hosting;
      try{
        hosting = await detectHosting(parsed.owner,parsed.repo);
      }catch(err){
        console.error(err);
        hosting = { host:'', liveUrl:'',
          repoUrl: repo.htmlUrl || ('https://github.com/'+repo.fullName),
          dashboardUrl:'',
          deployNote:'Hosting konnte nicht abgefragt werden: '+err.message };
      }
      HOSTING_FIELDS.forEach(k=>{ hosting[k] = String(hosting[k]||'').trim(); });
      ['liveUrl','repoUrl','dashboardUrl'].forEach(k=>{ hosting[k] = normalizeUrl(hosting[k]); });
      await updateDoc(doc(db,'projects',ref.id),{
        hosting: Object.assign({},hosting,{updatedAt:serverTimestamp()})
      });
    }catch(err){
      console.error(err);
      alert('Projekt konnte nicht angelegt werden. '+describeError(err));
    }
    githubHomeRepaint();
  }

  function renderGithubHome(box){
    const head = el('div',{style:'display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;'},[
      el('p',{class:'section-label',text:'🔗 GitHub',style:'margin:0;'}),
      el('button',{class:'pill-btn host-link',type:'button',
        text: hasGithubToken() ? 'Token ändern' : 'Verbinden',
        onclick:()=>openGithubTokenModal(()=>{ myReposCache=null; githubHomeRepaint(); })})
    ]);
    function reset(){ box.innerHTML=''; box.appendChild(head); }
    reset();

    if(!hasGithubToken()){
      box.appendChild(el('p',{class:'hg-sub',style:'margin:0;',
        text:'Verbunden erkennt die App auch private Repos, zeigt deine Repos als Auswahlliste '+
             'und schlägt hier Repos vor, für die noch kein Projekt existiert.'}));
      return;
    }

    box.appendChild(el('p',{class:'hg-sub',style:'margin:0;',text:'Repos werden geladen …'}));

    getMyRepos().then(repos=>{
      if(!box.isConnected) return;              // Ansicht inzwischen gewechselt
      const linked = linkedRepoKeys();
      const missing = repos.filter(r=> !linked.has(r.fullName.toLowerCase()));
      reset();
      if(missing.length===0){
        box.appendChild(el('p',{class:'hg-sub',style:'margin:0;',
          text:'Für alle '+repos.length+' Repos existiert schon ein Projekt.'}));
        return;
      }
      box.appendChild(el('p',{class:'hg-sub',style:'margin:0 0 12px;',
        text:(missing.length===1 ? '1 Repo hat noch kein Projekt'
                                 : missing.length+' Repos haben noch kein Projekt')+
             ' – antippen legt eines an und erkennt das Hosting gleich mit.'}));
      box.appendChild(buildRepoPicker(missing,(r)=>{
        reset();
        box.appendChild(el('p',{class:'hg-sub',style:'margin:0;',
          text:'„'+r.name+'“ wird angelegt und bei GitHub geprüft …'}));
        createProjectFromRepo(r);
      }));
    }).catch(err=>{
      console.error(err);
      if(!box.isConnected) return;
      reset();
      box.appendChild(el('p',{class:'hg-status err',text:err.message}));
    });
  }

  // ── Anzeige im Projekt-Header ─────────────────────────────
  function buildHostingBar(project){
    const bar = el('div',{class:'host-bar'});

    function hostLink(label,url){
      const href = normalizeUrl(url);

      return el('a',{class:'pill-btn host-link',href,target:'_blank',rel:'noopener noreferrer',text:label});

  // ══════════════════════════════════════════════════════════
  //  APP-IDEEN
  // ══════════════════════════════════════════════════════════
  const IDEAS_CODE = '271201';

  // Code-Popup, das dem App-Ideen-Bereich vorgeschaltet ist.
  // onSuccess wird bei korrektem Code aufgerufen (Popup schließt sich zuvor),
  // onCancel beim Abbrechen bzw. Klick neben das Popup.
  function openIdeaCodeModal(onSuccess,onCancel){
    const codeInput = el('input',{type:'text',inputmode:'numeric',pattern:'[0-9]*',
      autocomplete:'off',placeholder:'Code eingeben',maxlength:'12'});
    const errorMsg = el('p',{style:'color:var(--danger);font-size:13px;margin:10px 0 0;display:none;',
      text:'Falscher Code – bitte erneut versuchen.'});

    const overlay = el('div',{class:'modal-overlay'});
    // Nur einmal abschliessen – sonst käme onCancel auch nach dem Erfolg dran.
    let settled = false;
    function finish(ok){
      if(settled) return;
      settled = true;
      overlay.remove();
      if(ok){ if(typeof onSuccess==='function') onSuccess(); }
      else  { if(typeof onCancel==='function')  onCancel();  }
    }
    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) finish(false); });
    const okBtn = el('button',{class:'btn',text:'Bestätigen'});

    const modal = el('div',{class:'modal'},[
      el('h2',{text:'App-Ideen'}),
      el('div',{class:'field'},[el('label',{text:'Code'}),codeInput,errorMsg]),
      el('div',{class:'modal-actions'},[
        el('button',{class:'btn ghost',text:'Abbrechen',onclick:()=>finish(false)}),
        okBtn
      ])
    ]);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    codeInput.focus();

    function submit(){
      if(codeInput.value.trim()===IDEAS_CODE){
        finish(true);
      } else {
        errorMsg.style.display='block';
        codeInput.value='';
        codeInput.focus();
      }
    }
    okBtn.addEventListener('click',submit);
    codeInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); }});
    codeInput.addEventListener('input',()=>{ errorMsg.style.display='none'; });
  }

  function buildIdeaForm(){
    const ta = el('textarea',{placeholder:'Neue App-Idee festhalten … (beliebig lang)',rows:'3',maxlength:'8000'});
    const btn = el('button',{class:'btn',text:'Idee speichern'});
    const form = el('form',{class:'add-row'},[ta,btn]);
    form.addEventListener('submit',async(e)=>{
      e.preventDefault();
      const val = ta.value.trim();
      if(!val) return;
      btn.disabled=true;
      try{
        // Neue Ideen oben einsortieren (kleinster order-Wert = oben).
        const minOrder = ideasCache.reduce((m,d)=>Math.min(m, d.order??0), 0);
        await addDoc(ideasRef,{text:val,order:minOrder-1,createdAt:serverTimestamp()});
        ta.value='';
      }catch(err){ console.error(err); alert('Idee konnte nicht gespeichert werden.'); }
      btn.disabled=false; ta.focus();
    });
    return form;
  }

  function subscribeIdeas(container,status){
    // Nach createdAt (neu→alt) abfragen – das ist auch die Alt-Anzeige­reihenfolge,
    // anhand derer fehlende order-Werte einmalig initialisiert werden.
    const q = query(ideasRef, orderBy('createdAt','desc'));
    track(onSnapshot(q,(snap)=>{
      let docs = snap.docs.map(d=>({id:d.id, ...d.data()}));

      // Migration: App-Ideen ohne order-Feld anhand der aktuellen Anzeige-
      // reihenfolge (createdAt desc) mit fortlaufenden Werten versehen.
      if(docs.some(d=> typeof d.order !== 'number')){
        const batch = writeBatch(db);
        docs.forEach((d,i)=>{
          if(typeof d.order !== 'number'){
            d.order = i;
            batch.update(doc(db,'appIdeas',d.id),{order:i});
          }
        });
        batch.commit().catch(err=>console.error(err));
      }

      // Aufsteigend nach order sortieren (kleinster Wert = oben).
      docs.sort((a,b)=> (a.order??0) - (b.order??0));
      ideasCache = docs;

      if(status) status.ok();
      container.innerHTML='';
      if(docs.length===0){
        container.appendChild(el('p',{class:'empty',text:'Noch keine Ideen – schreib deine erste oben hinein.'}));
        return;
      }
      docs.forEach((d,i)=> container.appendChild(buildIdeaItem(d.id,d,i,docs.length)));
    },(err)=>{ if(status) status.fail(err); else console.error(err); }));
  }

  async function moveIdea(index,dir){
    const target = index+dir;
    if(target<0 || target>=ideasCache.length) return;
    const a = ideasCache[index], b = ideasCache[target];
    const oa = (a.order ?? index), ob = (b.order ?? target);
    try{

  // ── Konzept / Prompt Speicher (Popup pro App-Idee) ─────────
  // Gemeinsame Kopierlogik: MUSS synchron im Klick-Handler starten
  // (iOS Safari verweigert Clipboard-Zugriff nach await/setTimeout).
  function copyTextSync(txt){
    if(navigator.clipboard && navigator.clipboard.writeText){
      try{
        const p = navigator.clipboard.writeText(txt);
        if(p && typeof p.then==='function'){
          return p.then(()=>true).catch(()=>fallbackCopy(txt));
        }
        return Promise.resolve(true);
      }catch(err){
        return Promise.resolve(fallbackCopy(txt));
      }
    }
    return Promise.resolve(fallbackCopy(txt));
  }
  // Fallback ohne Clipboard-API – auf iOS zuverlässig via Range + contentEditable.
  function fallbackCopy(txt){
    let ok=false;
    const ta = document.createElement('textarea');
    ta.value = txt;
    ta.setAttribute('readonly','');
    ta.contentEditable = 'true';
    ta.style.position='fixed';
    ta.style.top='0'; ta.style.left='0';
    ta.style.width='1px'; ta.style.height='1px';
    ta.style.padding='0'; ta.style.border='none';
    ta.style.opacity='0';
    document.body.appendChild(ta);
    try{
      const range = document.createRange();
      range.selectNodeContents(ta);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      ta.setSelectionRange(0, txt.length);
      ok = document.execCommand('copy');
      sel.removeAllRanges();
    }catch(err){ console.error(err); ok=false; }
    document.body.removeChild(ta);
    return ok;
  }

  // docRef ist eine fertige Firestore-Dokument-Referenz. Dadurch funktioniert
  // derselbe Dialog für App-Ideen (appIdeas/…) und für die Aufgaben eines
  // Projekts (projects/…/entries/… bzw. die Legacy-Collection).
  // opts.metaLabel ersetzt den Einleitungstext der Meta-Zeile.
  function openCpModal(docRef, data, field, opts = {}){
    const isPrompt = field==='prompt';
    const title = isPrompt ? 'Prompt' : 'Konzept';
    let current = data[field] || '';
    let editing = false;
    let dirty = false;
    let copyBtnRef = null;

    const overlay = el('div',{class:'modal-overlay'});
    const modal   = el('div',{class:'modal wide'});
    overlay.appendChild(modal);

    const snippet = (data.text||'').replace(/\s+/g,' ').trim();
    const metaText = snippet.length>80 ? snippet.slice(0,80)+'…' : snippet;
    const metaLabel = (opts && typeof opts.metaLabel==='string' && opts.metaLabel) ? opts.metaLabel : 'Zur Idee: ';

    // Kopfzeile: Titel links, zusätzlicher Kopieren-Button rechts (sticky).
    const headCopyBtn = el('button',{class:'btn cp-copy-head',type:'button',
      title:'Kompletten Text kopieren','aria-label':'Kompletten Text kopieren'});
    headCopyBtn.innerHTML = '<span class="cp-copy-ico" aria-hidden="true">⧉</span><span class="cp-copy-txt">Kopieren</span>';
    headCopyBtn.addEventListener('click',()=>runCopyOn(headCopyBtn));
    const head = el('div',{class:'cp-head'},[ el('h2',{text:title}), headCopyBtn ]);

    const contentWrap = el('div');
    const actions = el('div',{class:'modal-actions'});
    modal.appendChild(head);
    modal.appendChild(el('div',{class:'cp-meta',text:metaLabel+(metaText||'(ohne Text)')}));
    modal.appendChild(contentWrap);
    modal.appendChild(actions);

    // Kopier-Feedback: Beschriftung/Farbe kurz umschalten, dann zurücksetzen.
    function flashBtn(btn, success){
      if(!btn) return;
      if(btn._flashTimer) clearTimeout(btn._flashTimer);
      if(btn._origHtml==null) btn._origHtml = btn.innerHTML;
      const isHead = btn.classList.contains('cp-copy-head');
      if(success){
        btn.innerHTML = isHead
          ? '<span class="cp-copy-ico" aria-hidden="true">✓</span><span class="cp-copy-txt">Kopiert</span>'
          : 'Kopiert ✓';
        btn.classList.add('copied');
      }else{
        btn.innerHTML = isHead
          ? '<span class="cp-copy-ico" aria-hidden="true">✕</span><span class="cp-copy-txt">Fehler</span>'
          : 'Fehlgeschlagen';
        btn.classList.add('failed');
      }
      btn._flashTimer = setTimeout(()=>{
        if(btn._origHtml!=null){ btn.innerHTML = btn._origHtml; btn._origHtml=null; }
        btn.classList.remove('copied','failed');
        btn._flashTimer=null;
      },1500);
    }
    // Startet den Kopiervorgang synchron (Pflicht für iOS) und meldet danach das Ergebnis.
    function runCopyOn(btn){
      if(!current) return;
      copyTextSync(current).then(ok=>{ flashBtn(btn, ok!==false); });
    }
    function refreshCopyBtns(){
      headCopyBtn.disabled = !(current && current.length);
    }

    function close(){
      if(editing && dirty && !confirm('Ungespeicherte Änderungen verwerfen?')) return;
      document.removeEventListener('keydown',onKey);
      document.body.style.overflow='';
      overlay.remove();
    }

    function renderView(){
      editing=false; dirty=false;
      contentWrap.innerHTML=''; actions.innerHTML='';
      if(current && current.trim()){
        contentWrap.appendChild(el('div',{class:'cp-content'+(isPrompt?' prompt':''),text:current}));
      } else {
        contentWrap.appendChild(el('div',{class:'cp-content placeholder',
          text:'Noch nichts gespeichert. Über „Bearbeiten" lässt sich hier ein '+title+' hinterlegen.'}));
      }
      copyBtnRef = el('button',{class:'btn',text:'Kopieren'});
      copyBtnRef.disabled = !(current && current.length);
      copyBtnRef.addEventListener('click',()=>runCopyOn(copyBtnRef));
      actions.appendChild(copyBtnRef);
      actions.appendChild(el('button',{class:'btn ghost',text:'Bearbeiten',onclick:renderEdit}));
      actions.appendChild(el('button',{class:'btn ghost',text:'Schließen',onclick:close}));
      refreshCopyBtns();
    }

    function renderEdit(){
      editing=true; dirty=false; copyBtnRef=null;
      contentWrap.innerHTML=''; actions.innerHTML='';
      const ta = el('textarea',{rows:'14',maxlength:'50000',
        placeholder:isPrompt?'Prompt hier eingeben …':'Konzept hier eingeben …'});
      if(isPrompt) ta.style.fontFamily="'IBM Plex Mono',monospace";
      ta.value = current;
      ta.addEventListener('input',()=>{ dirty = (ta.value !== current); });
      contentWrap.appendChild(ta);

      const saveBtn = el('button',{class:'btn',text:'Speichern'});
      const cancelBtn = el('button',{class:'btn ghost',text:'Abbrechen'});
      saveBtn.addEventListener('click',async()=>{
        const val = ta.value;
        saveBtn.disabled=true;
        try{
          await updateDoc(docRef,{[field]:val,updatedAt:serverTimestamp()});
          current = val; data[field] = val; dirty=false;
          renderView();
        }catch(err){ console.error(err); alert('Konnte nicht gespeichert werden.'); saveBtn.disabled=false; }
      });
      cancelBtn.addEventListener('click',()=>{
        if(dirty && !confirm('Ungespeicherte Änderungen verwerfen?')) return;
        dirty=false;
        if(current && current.trim()) renderView(); else close();
      });
      actions.appendChild(saveBtn);
      actions.appendChild(cancelBtn);
      refreshCopyBtns();
      ta.focus();
    }

    function onKey(e){
      if(e.key==='Escape'){ e.preventDefault(); close(); return; }
      if((e.ctrlKey||e.metaKey) && (e.key==='c'||e.key==='C')){
        const sel = window.getSelection ? String(window.getSelection()) : '';
        const ae = document.activeElement;
        const inField = ae && (ae.tagName==='TEXTAREA' || ae.tagName==='INPUT');
        if(!sel && !inField && current){
          e.preventDefault();
          runCopyOn(copyBtnRef || headCopyBtn);
        }
      }
    }

    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) close(); });
    document.addEventListener('keydown',onKey);
    document.body.style.overflow='hidden';
    document.body.appendChild(overlay);

    // Leeres Feld → direkt in den Bearbeiten-Modus (mit Platzhalter-Textarea)
    if(current && current.trim()) renderView(); else renderEdit();
  }

  // Kopier-Feedback für die schlichten Prompt-Buttons (Beschriftung kurz umschalten).
  function flashCopyBtn(btn, success){
    if(!btn) return;
    if(btn._flashTimer) clearTimeout(btn._flashTimer);
    if(btn._origText==null) btn._origText = btn.textContent;
    btn.textContent = success ? 'Kopiert!' : 'Fehlgeschlagen';
    btn.classList.remove('copied','failed');
    btn.classList.add(success ? 'copied' : 'failed');
    btn._flashTimer = setTimeout(()=>{
      if(btn._origText!=null){ btn.textContent = btn._origText; btn._origText=null; }
      btn.classList.remove('copied','failed');
      btn._flashTimer=null;
    },1500);
  }

  function buildPromptForm(){
    const titleInput = el('input',{type:'text',maxlength:'160',
      placeholder:'Kurz: worum geht es in dem Prompt?'});
    const ta = el('textarea',{rows:'6',maxlength:'50000',
      placeholder:'Vollständigen Prompt-Text hier hineinschreiben …'});
    const btn = el('button',{class:'btn',text:'Prompt speichern'});
    const form = el('form',{class:'sp-form'},[
      el('div',{class:'field'},[el('label',{text:'Titel'}),titleInput]),
      el('div',{class:'field'},[el('label',{text:'Prompt'}),ta]),
      el('div',{class:'sp-form-actions'},[btn])
    ]);
    form.addEventListener('submit',async(e)=>{
      e.preventDefault();
      const text = ta.value.trim();
      if(!text){ ta.focus(); return; }
      const title = titleInput.value.trim();
      btn.disabled=true;
      try{
        // Neue Prompts oben einsortieren (kleinster order-Wert = oben).
        const minOrder = promptsCache.reduce((m,d)=>Math.min(m, d.order??0), 0);
        await addDoc(promptsRef,{title,text,order:minOrder-1,createdAt:serverTimestamp()});
        titleInput.value=''; ta.value='';
      }catch(err){ console.error(err); alert('Prompt konnte nicht gespeichert werden.'); }
      btn.disabled=false; titleInput.focus();
    });
    return form;
  }

  function subscribePrompts(container,status){
    const q = query(promptsRef, orderBy('createdAt','desc'));
    track(onSnapshot(q,(snap)=>{
      let docs = snap.docs.map(d=>({id:d.id, ...d.data()}));

      // Migration: Prompts ohne order-Feld anhand der aktuellen Anzeige-
      // reihenfolge (createdAt desc) mit fortlaufenden Werten versehen.
      if(docs.some(d=> typeof d.order !== 'number')){
        const batch = writeBatch(db);
        docs.forEach((d,i)=>{
          if(typeof d.order !== 'number'){
            d.order = i;
            batch.update(doc(db,'savedPrompts',d.id),{order:i});
          }
        });
        batch.commit().catch(err=>console.error(err));
      }

      docs.sort((a,b)=> (a.order??0) - (b.order??0));
      promptsCache = docs;

      if(status) status.ok();
      container.innerHTML='';
      if(docs.length===0){
        container.appendChild(el('p',{class:'empty',
          text:'Noch keine Prompts gespeichert – leg oben deinen ersten an.'}));
        return;
      }
      docs.forEach((d,i)=> container.appendChild(buildPromptItem(d.id,d,i,docs.length)));
    },(err)=>{ if(status) status.fail(err); else console.error(err); }));
  }

  async function movePrompt(index,dir){
    const target = index+dir;
    if(target<0 || target>=promptsCache.length) return;
    const a = promptsCache[index], b = promptsCache[target];
    const oa = (a.order ?? index), ob = (b.order ?? target);
    try{
      const batch = writeBatch(db);
      batch.update(doc(db,'savedPrompts',a.id),{order:ob});
      batch.update(doc(db,'savedPrompts',b.id),{order:oa});
      await batch.commit();
    }catch(err){ console.error(err); alert('Reihenfolge konnte nicht geändert werden.'); }
  }

  function buildPromptItem(id,data,index,total){
    const item = el('div',{class:'sp-item'});

    const titleDiv = el('div',{class:'sp-title',text:(data.title||'').trim() || 'Ohne Titel'});

      toggle.textContent = open ? 'Weniger anzeigen' : 'Mehr anzeigen';
    });
    // Erst nach dem Einhängen ist messbar, ob der Prompt überhaupt abgeschnitten wird.
    requestAnimationFrame(()=>{
      if(bodyDiv.scrollHeight > bodyDiv.clientHeight + 2){
        bodyDiv.classList.add('clipped');
        toggle.style.display='inline-block';
      }
    });

    const foot = el('div',{class:'sp-foot'});
    foot.appendChild(el('div',{class:'meta',
      text:(data.updatedAt?'bearb. ':'')+fmtDate(data.updatedAt||data.createdAt)}));

    const move = el('div',{class:'idea-move'});
    const upBtn   = el('button',{class:'ctrl-btn',title:'Nach oben',text:'▲',onclick:()=>movePrompt(index,-1)});
    const downBtn = el('button',{class:'ctrl-btn',title:'Nach unten',text:'▼',onclick:()=>movePrompt(index,1)});
    upBtn.disabled   = (index===0);
    downBtn.disabled = (index===total-1);
    move.appendChild(upBtn); move.appendChild(downBtn);
    actions.appendChild(move);

    // Kopieren: muss synchron im Klick-Handler starten (iOS Safari).
    const copyBtn = el('button',{class:'btn small sp-copy',type:'button',text:'Kopieren'});
    copyBtn.disabled = !text;
    copyBtn.addEventListener('click',()=>{
      if(!text) return;
      copyTextSync(text).then(ok=>{ flashCopyBtn(copyBtn, ok!==false); });
    });
    actions.appendChild(copyBtn);

    const editBtn = el('button',{class:'row-btn',title:'Bearbeiten',text:'✎',style:'opacity:.85;'});
    const delBtn  = el('button',{class:'row-btn del',title:'Löschen',text:'✕',style:'opacity:.85;'});
    actions.appendChild(editBtn); actions.appendChild(delBtn);
    foot.appendChild(actions);

    delBtn.addEventListener('click',async()=>{
      if(!confirm('Diesen gespeicherten Prompt löschen?')) return;
      try{ await deleteDoc(doc(db,'savedPrompts',id)); }
      catch(err){ console.error(err); alert('Konnte nicht gelöscht werden.'); }
    });

    editBtn.addEventListener('click',()=>{
      const titleInput = el('input',{type:'text',maxlength:'160',placeholder:'Titel'});
      titleInput.value = data.title || '';
      const ta = el('textarea',{rows:'10',maxlength:'50000',placeholder:'Prompt-Text'});
      ta.style.fontFamily = "'IBM Plex Mono',monospace";
      ta.value = text;
      const save   = el('button',{class:'btn small',text:'Speichern'});
      const cancel = el('button',{class:'btn small ghost',text:'Abbrechen'});
      const box = el('div',{},[
        el('div',{class:'field'},[el('label',{text:'Titel'}),titleInput]),
        el('div',{class:'field'},[el('label',{text:'Prompt'}),ta]),
        el('div',{class:'edit-actions'},[save,cancel])
      ]);
      restore(box);
      titleInput.focus();

      cancel.addEventListener('click',()=>{ restore(null); });
      save.addEventListener('click',async()=>{
        const val = ta.value.trim();
        if(!val){ ta.focus(); return; }
        save.disabled=true;
        try{
          await updateDoc(doc(db,'savedPrompts',id),{
            title:titleInput.value.trim(), text:val, updatedAt:serverTimestamp()
          });
        }catch(err){
          console.error(err); alert('Konnte nicht gespeichert werden.'); save.disabled=false;
        }
      });
    });

    // Inhalt austauschen (Bearbeiten) bzw. Ansicht wiederherstellen
    function restore(editBox){
      item.innerHTML='';
      if(editBox){ item.appendChild(editBox); return; }
      item.appendChild(titleDiv);
      item.appendChild(bodyDiv);
      item.appendChild(toggle);
      item.appendChild(foot);
    }

    restore(null);
    return item;
  }
