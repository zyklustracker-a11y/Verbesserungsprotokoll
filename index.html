<!-- Installierbare App. iOS braucht dafür die apple-mobile-web-app-Angaben
     oben, Android und Desktop-Chrome dieses Manifest. Die Farben darin
     entsprechen --ink-bg; wird das Token geändert, dort mitändern. -->
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Schriften bewusst NICHT renderblockierend laden: sonst wartet der Browser
     auf Google, bevor er überhaupt etwas zeichnet – und der Ladescreen käme
     zu spät. Der Ladescreen selbst benutzt keine Webschrift. Freigegeben wird
     die App erst, wenn die Schriften da sind (document.fonts.ready), es
     blitzt also trotzdem kein Schriftwechsel auf. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --ink-bg:#1b1d21;
    --ink-bg-raised:#212327;
    --ink-bg-raised2:#262a2f;
    --paper-text:#e4e2dc;
    --paper-text-dim:#9a978f;
    --hairline:#34363b;
    --brass:#c08552;
    --brass-dim:#8a5f39;
    --sage:#7a9b76;
    --sage-dim:#4f6a4c;
    --danger:#a5645a;
    /* Hosting-Badges: eine eigene Farbe je bekanntem Anbieter. Alle Töne sind
       bewusst hell genug, damit die dunkle Schrift (#1b1d21) gut lesbar bleibt.
       Unbekannte Hosts bekommen kein eigenes Token, sondern das neutrale Badge. */
    --host-netlify:#5cb8b2;
    --host-vercel:#ced1d8;
    --host-render:#7fa7e8;
    --host-fly:#b191d6;
    --host-firebase:#e6b34c;
    --host-railway:#d18fb0;
    --host-cloudflare:#e8934e;
    --host-ghpages:#8fa8c8;
    --host-vps:#97b892;
    /* Spaltenbreiten: Startseite kompakt, Projektansicht breit,
       damit lange Unternotizen in die Breite statt in die Höhe laufen */
    --wrap-max:820px;
    --wrap-max-wide:1180px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  /* ── Ladescreen ──────────────────────────────────────────────────
     Markup, Stil und Logo stehen alle inline in dieser Datei, deshalb
     ist der Schirm schon beim allerersten Paint da – die halbfertige
     App blitzt nie auf. Farben ausschliesslich aus den Tokens. */
  #splash{
    position:fixed;
    inset:0;
    z-index:100;                  /* über Modal (50) und Menü-Overlay (60) */
    display:flex;
    align-items:center;
    justify-content:center;
    /* Safe-Area mitrechnen, falls die Seite je unter den Notch reicht */
    padding:calc(24px + env(safe-area-inset-top,0px))
            calc(24px + env(safe-area-inset-right,0px))
            calc(24px + env(safe-area-inset-bottom,0px))
            calc(24px + env(safe-area-inset-left,0px));
    background:radial-gradient(circle at 50% 42%,
                               var(--ink-bg-raised2) 0%,
                               var(--ink-bg) 68%);
    transition:opacity .5s ease;
    --splash-logo:clamp(96px,24vmin,128px);
    --splash-gap:30px;
  }
  #splash.weg{opacity:0;pointer-events:none;}
  body.splash-an{overflow:hidden;}
  /* Das Logo sitzt exakt in der Mitte, der Balken hängt darunter. Deshalb
     absolut positioniert statt als zentrierte Spalte – sonst wäre die
     Gruppe mittig und das Logo sässe um die halbe Balkenhöhe zu hoch. */
  .splash-inner{position:relative;width:100%;height:100%;}
  #splash-logo{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:var(--splash-logo);
    height:var(--splash-logo);
    border-radius:23%;            /* wie ein App-Symbol */
    display:block;
  }
  .splash-bar{
    position:absolute;
    left:50%;
    top:calc(50% + var(--splash-logo) / 2 + var(--splash-gap));
    transform:translateX(-50%);
    width:min(210px,54vw);
    height:4px;
    border-radius:999px;
    background:var(--hairline);
    overflow:hidden;
  }
  .splash-bar-fill{
    width:0;
    height:100%;
    border-radius:999px;
    background:var(--brass);
  }
  body{
    background:var(--ink-bg);
    color:var(--paper-text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:var(--wrap-max);
    margin:0 auto;
    padding:56px 28px 100px;
  }
  /* Projektansicht darf den Bildschirm breiter nutzen: lange Notizen
     brauchen dadurch deutlich weniger Zeilen und die Liste bleibt überschaubar. */
  .wrap.view-project{max-width:var(--wrap-max-wide);}
  header.app-head{
    margin-bottom:40px;
    border-bottom:1px solid var(--hairline);
    padding-bottom:28px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0 0 10px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:40px;
    letter-spacing:-0.01em;
    margin:0 0 8px;
    color:var(--paper-text);
  }
  .sub{
    color:var(--paper-text-dim);
    font-size:14.5px;
    margin:0;
  }
  .status-dot{
    display:inline-block;
    width:7px;height:7px;
    border-radius:50%;
    background:var(--sage);
    margin-right:7px;
    position:relative;
    top:-1px;
  }
  .status-dot.offline{background:var(--danger);}

  /* Back link */
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:none;
    border:none;
    color:var(--paper-text-dim);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    cursor:pointer;
    padding:0;
    margin-bottom:22px;
    transition:color .15s ease;
  }
  .back-link:hover{color:var(--brass);}

  /* Buttons */
  input[type=text],input[type=password],input[type=time],textarea{
    background:var(--ink-bg-raised);
    border:1px solid var(--hairline);
    color:var(--paper-text);
    font-family:'Inter',sans-serif;
    font-size:16px;               /* 16px verhindert iOS-Zoom & Fokus-Probleme */
    padding:14px 16px;
    border-radius:3px;
    outline:none;
    transition:border-color .15s ease;
    width:100%;
    -webkit-user-select:text;
    user-select:text;
    -webkit-touch-callout:default;
    touch-action:manipulation;
  }
  textarea{resize:vertical;line-height:1.5;min-height:52px;}
  input[type=text]::placeholder,input[type=password]::placeholder,textarea::placeholder{color:var(--paper-text-dim);}
  input[type=text]:focus,input[type=password]:focus,input[type=time]:focus,textarea:focus{border-color:var(--brass-dim);}
  /* Uhrzeit-Feld: das eingebaute Symbol ist sonst fast unsichtbar */
  input[type=time]{color-scheme:dark;}

  button.btn{
    background:var(--brass);
    color:#1b1d21;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:0 22px;
    height:48px;
    border-radius:3px;
    cursor:pointer;
    transition:background .15s ease;
    white-space:nowrap;
  }
  button.btn:hover{background:#d09865;}
  button.btn:disabled{opacity:.5;cursor:default;}
  button.btn.ghost{
    background:transparent;
    color:var(--paper-text-dim);
    border:1px solid var(--hairline);
  }
  button.btn.ghost:hover{background:var(--ink-bg-raised);color:var(--paper-text);}
  button.btn.small{height:40px;font-size:13px;padding:0 16px;}

  form.add-row{display:flex;gap:10px;margin-bottom:14px;align-items:flex-start;}
  form.add-row textarea{flex:1;min-height:52px;}
  /* Eingabeformular der Projektansicht: Vorschlag, Notiz und Button
     untereinander. Bewusst eine eigene Klasse – .add-row wird auch von den
     To-dos und den App-Ideen benutzt und bleibt unangetastet. */
  form.add-stack{display:flex;flex-direction:column;gap:10px;align-items:stretch;}
  form.add-stack textarea{width:100%;min-height:52px;}
  form.add-stack .btn{align-self:flex-start;}

  /* Home: project grid */
  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--paper-text-dim);
    margin:0 0 16px;
  }
  .home-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;
    margin-bottom:48px;
  }
  .project-card{
    background:var(--ink-bg-raised);
    border:1px solid var(--hairline);
    border-left:3px solid var(--brass);
    border-radius:5px;
    padding:18px 18px 14px;
    cursor:pointer;
    transition:border-color .15s ease, transform .1s ease, background .15s ease;
    position:relative;
    display:flex;
    flex-direction:column;
    min-height:120px;
  }
  .project-card:hover{background:var(--ink-bg-raised2);transform:translateY(-1px);}
  .card-icon{font-size:28px;line-height:1;margin-bottom:12px;}
  .card-name{
    font-family:'Fraunces',serif;
    font-size:19px;
    font-weight:500;
    margin:0;
    word-break:break-word;
  }
  .card-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--paper-text-dim);
    margin-top:6px;
  }
  .card-controls{
    display:flex;
    gap:2px;
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid var(--hairline);
    opacity:1;                    /* auf Touch immer sichtbar */
    transition:opacity .15s ease;
  }
  .ctrl-btn{
    background:none;
    border:none;
    color:var(--paper-text-dim);
    cursor:pointer;
    font-size:16px;
    padding:8px 11px;             /* größere Tap-Fläche fürs Handy */
    border-radius:3px;
    transition:color .12s ease, background .12s ease;
    line-height:1;
  }
  .ctrl-btn:active{background:var(--ink-bg);}
  .ctrl-btn.danger:active{color:var(--danger);}
  .ctrl-spacer{flex:1;}
  /* Dezentes Ein-/Ausblenden nur auf Geräten mit echter Maus (Desktop) */
  @media (hover:hover) and (pointer:fine){
    .card-controls{opacity:.55;}
    .project-card:hover .card-controls{opacity:1;}
    .ctrl-btn{font-size:14px;padding:4px 7px;}
    .ctrl-btn:hover{color:var(--paper-text);background:var(--ink-bg);}
    .ctrl-btn.danger:hover{color:var(--danger);}
  }

  /* Entries */
  section.category{margin-bottom:44px;}
  .cat-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:4px;
    padding-bottom:12px;
    border-bottom:1px solid var(--hairline);
  }
  .cat-title{font-family:'Fraunces',serif;font-size:19px;font-weight:500;margin:0;}
  .cat-title.done{color:var(--paper-text-dim);}
  .cat-count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--paper-text-dim);}

  ul.entries{list-style:none;margin:0;padding:0;}
  li.entry{
    display:flex;
    align-items:flex-start;
    gap:14px;
    padding:16px 0;
    border-bottom:1px solid var(--hairline);
  }
  li.entry:last-child{border-bottom:none;}
  .idx{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--brass-dim);
    padding-top:3px;
    min-width:28px;
  }
  .checkbox{
    flex-shrink:0;
    width:19px;height:19px;
    border:1.5px solid var(--paper-text-dim);
    border-radius:3px;
    cursor:pointer;
    margin-top:2px;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .15s ease, background .15s ease;
    background:transparent;
  }
  .checkbox:hover{border-color:var(--brass);}
  .checkbox.checked{background:var(--sage-dim);border-color:var(--sage);}
  .checkbox svg{width:12px;height:12px;opacity:0;transition:opacity .1s ease;}
  .checkbox.checked svg{opacity:1;}

  .entry-body{flex:1;min-width:0;}
  /* Titel des Vorschlags: bricht wie die Notiz erst am rechten Rand um und
     zerlegt notfalls auch überlange Wörter/URLs (kein waagerechtes Scrollen). */
  .entry-text{
    font-size:15px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:anywhere;
  }
  .entry-text.done{color:var(--paper-text-dim);text-decoration:line-through;text-decoration-color:var(--hairline);}
  .entry-note{
    font-size:13.5px;
    line-height:1.55;
    color:var(--paper-text-dim);
    margin-top:7px;
    padding-left:12px;
    border-left:2px solid var(--hairline);
    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:anywhere;
    /* volle Breite der Eintragsspalte nutzen – keine künstliche Begrenzung */
    width:100%;
    max-width:none;
  }
  .meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--paper-text-dim);
    margin-top:8px;
  }
  .entry-actions{display:flex;gap:2px;flex-shrink:0;align-items:flex-start;}
  /* Prompt-Pille sitzt zwischen Pfeilen und Stift – leicht ausgerichtet */
  .entry-actions .pill-btn{margin-top:2px;align-self:flex-start;}
  /* Priorisierungs-Pfeile: dezent, aber sicher treffbares 32×32-Tap-Ziel fürs iPhone */
  .entry-move{display:flex;gap:1px;align-items:center;margin-right:2px;}
  .entry-move .ctrl-btn{
    font-size:13px;padding:0;
    min-width:32px;min-height:32px;
    display:flex;align-items:center;justify-content:center;
  }
  .row-btn{
    background:none;border:none;color:var(--paper-text-dim);
    cursor:pointer;font-size:17px;padding:8px 11px;border-radius:3px;
    opacity:.9;                   /* auf Touch dauerhaft sichtbar */
    transition:opacity .12s ease, color .12s ease, background .12s ease;
  }
  .row-btn:active{background:var(--ink-bg-raised);color:var(--paper-text);}
  .row-btn.del:active{color:var(--danger);}
  /* Dezentes Ein-/Ausblenden nur auf Geräten mit echter Maus (Desktop) */
  @media (hover:hover) and (pointer:fine){
    .row-btn{opacity:0;font-size:14px;padding:2px 6px;}
    li.entry:hover .row-btn{opacity:.85;}
    .row-btn:hover{color:var(--paper-text);background:var(--ink-bg-raised);opacity:1;}
    .row-btn.del:hover{color:var(--danger);}
  }

  .edit-box{flex:1;min-width:0;}
  .edit-box textarea{margin-bottom:8px;}
  .edit-actions{display:flex;gap:8px;}

  .empty{color:var(--paper-text-dim);font-size:14px;font-style:italic;padding:18px 0;}

  /* Ideas */
  .idea-item{
    background:var(--ink-bg-raised);
    border:1px solid var(--hairline);
    border-radius:5px;
    padding:16px 18px;
    margin-bottom:12px;
  }
  .idea-text{font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
  .idea-foot{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:12px;padding-top:10px;border-top:1px solid var(--hairline);
  }
  .idea-foot .meta{margin:0;}
  .idea-actions{display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
  .idea-foot{flex-wrap:wrap;gap:8px 10px;}
  .idea-move{display:flex;gap:2px;align-items:center;margin-right:2px;}
  .ctrl-btn:disabled{opacity:.28;cursor:default;background:none;}

  /* Gespeicherte Prompts */
  .sp-form{margin-bottom:18px;}
  .sp-form .field{margin-bottom:10px;}
  .sp-form .field:last-of-type{margin-bottom:14px;}
  .sp-form textarea{min-height:110px;font-family:'IBM Plex Mono',monospace;font-size:14px;}
  .sp-form-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .sp-item{
    background:var(--ink-bg-raised);
    border:1px solid var(--hairline);
    border-radius:5px;
    padding:16px 18px;
    margin-bottom:12px;
  }
  .sp-title{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:17.5px;
    line-height:1.35;
    margin:0 0 11px;
    word-break:break-word;
  }
  .sp-body{
    position:relative;
    background:var(--ink-bg);
    border:1px solid var(--hairline);
    border-radius:4px;
    padding:13px 15px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    line-height:1.6;
    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:anywhere;
    max-height:170px;
    overflow:hidden;
  }
  .sp-body.open{max-height:none;overflow:visible;}
  /* Sanfte Kante, solange der Prompt eingeklappt ist */
  .sp-body.clipped::after{
    content:'';position:absolute;left:0;right:0;bottom:0;height:56px;
    background:linear-gradient(to bottom,rgba(27,29,33,0),var(--ink-bg));
    pointer-events:none;
  }
  .sp-toggle{
    background:none;border:none;padding:9px 0 0;
    font-family:'IBM Plex Mono',monospace;font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;
    color:var(--paper-text-dim);cursor:pointer;
    transition:color .12s ease;
  }
  .sp-toggle:hover{color:var(--brass);}
  .sp-foot{
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:8px 10px;
    margin-top:12px;padding-top:10px;border-top:1px solid var(--hairline);
  }
  .sp-foot .meta{margin:0;}
  .sp-actions{display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
  button.btn.sp-copy{height:38px;padding:0 18px;font-size:13px;min-width:112px;}
  button.btn.sp-copy.copied,button.btn.sp-copy.copied:hover{background:var(--sage);color:#1b1d21;}
  button.btn.sp-copy.failed,button.btn.sp-copy.failed:hover{background:var(--danger);color:#f4efe9;}

  /* Gespeicherte Dateien */
  input[type=file].file-input{
    width:100%;
    background:var(--ink-bg-raised);
    border:1px solid var(--hairline);
    border-radius:3px;
    color:var(--paper-text-dim);
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:11px 13px;
  }
  input[type=file].file-input::file-selector-button{
    background:var(--ink-bg-raised2);
    color:var(--paper-text);
    border:1px solid var(--hairline);
    border-radius:3px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:8px 14px;
    margin-right:12px;
    cursor:pointer;
  }
  .sf-item{
    background:var(--ink-bg-raised);
    border:1px solid var(--hairline);
    border-radius:5px;
    padding:16px 18px;
    margin-bottom:12px;
  }
  .sf-title{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:17.5px;
    line-height:1.35;
    margin:0 0 8px;
    word-break:break-word;
  }
  .sf-desc{
    font-size:14px;
    line-height:1.55;
    color:var(--paper-text-dim);
    white-space:pre-wrap;
    word-break:break-word;
    margin:0;
  }
  .sf-box{margin-top:12px;padding-top:12px;border-top:1px solid var(--hairline);}
  .sf-file{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:10px 0;border-bottom:1px solid var(--hairline);
  }
  .sf-file:last-child{border-bottom:none;}
  .sf-thumb{
    width:64px;height:64px;flex-shrink:0;
    object-fit:cover;
    border:1px solid var(--hairline);
    border-radius:4px;
    background:var(--ink-bg);
  }
  .sf-file-name{flex:1;min-width:130px;font-size:14px;line-height:1.4;word-break:break-word;}
  .sf-file-size{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;color:var(--paper-text-dim);margin-top:4px;
  }
  .sf-file-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;}
  .sf-add{margin-top:16px;padding-top:14px;border-top:1px solid var(--hairline);}
  /* Ordner-Überschrift in der Dateiliste */
  .sf-folder{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.08em;
    color:var(--paper-text-dim);
    margin:16px 0 2px;
    word-break:break-word;
  }
  .sf-folder:first-child{margin-top:0;}
  /* Ablagebereich für Dateien und ganze Ordner (nur am Rechner) */
  .sf-drop{
    margin-top:10px;
    border:1px dashed var(--hairline);
    border-radius:4px;
    padding:20px 16px;
    text-align:center;
    font-size:13px;
    color:var(--paper-text-dim);
    transition:border-color .12s ease, background .12s ease, color .12s ease;
  }
  .sf-drop.over{
    border-color:var(--brass);
    background:var(--ink-bg);
    color:var(--paper-text);
  }
  /* Schalter „Bilder verkleinern“ */
  .sf-opt{
    display:flex;align-items:flex-start;gap:10px;
    margin-top:12px;
    font-size:13.5px;line-height:1.45;
    color:var(--paper-text-dim);
    cursor:pointer;
  }
  .sf-opt input{
    width:18px;height:18px;flex-shrink:0;margin:1px 0 0;
    accent-color:var(--brass);
    cursor:pointer;
  }

  /* To-dos */
  .todo-item{
    background:var(--ink-bg-raised);
    border:1px solid var(--hairline);
    border-radius:5px;
    padding:16px 18px;
    margin-bottom:12px;
    transition:opacity .2s ease;
  }
  .todo-item.checked{opacity:.35;}
  .todo-row{display:flex;align-items:flex-start;gap:14px;}
  .todo-row .checkbox{margin-top:1px;}
  .todo-row .idea-text{flex:1;min-width:0;}

  /* Konzept / Prompt: Pill-Buttons */
  .pill-btn{
    background:transparent;
    border:1px solid var(--hairline);
    color:var(--paper-text-dim);
    font-family:'Inter',sans-serif;
    font-size:12px;
    padding:5px 11px;
    border-radius:3px;
    cursor:pointer;
    white-space:nowrap;
    transition:color .12s ease, border-color .12s ease, background .12s ease;
  }
  .pill-btn:hover{color:var(--paper-text);background:var(--ink-bg);}
  .pill-btn.has{color:var(--brass);border-color:var(--brass-dim);}

  /* Hosting: Zeile unter dem Projekttitel */
  .host-bar{margin-top:18px;}
  .host-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .host-badge{
    display:inline-flex;
    align-items:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#1b1d21;                 /* dunkle Schrift auf hellem Badge */
    background:var(--paper-text-dim);
    padding:5px 10px;
    border-radius:3px;
    white-space:nowrap;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  /* Unbekannte Hosts: neutral, aber weiterhin gut lesbar */
  .host-badge.neutral{
    background:var(--ink-bg-raised2);
    color:var(--paper-text);
    border:1px solid var(--hairline);
    padding:4px 9px;
  }
  .host-badge.netlify{background:var(--host-netlify);}
  .host-badge.vercel{background:var(--host-vercel);}
  .host-badge.render{background:var(--host-render);}
  .host-badge.fly{background:var(--host-fly);}
  .host-badge.firebase{background:var(--host-firebase);}
  .host-badge.railway{background:var(--host-railway);}
  .host-badge.cloudflare{background:var(--host-cloudflare);}
  .host-badge.ghpages{background:var(--host-ghpages);}
  .host-badge.vps{background:var(--host-vps);}
  /* Kleines Badge in der Projektliste */
  .host-badge.mini{
    font-size:10px;
    padding:3px 7px;
    margin-top:8px;
    align-self:flex-start;
  }
  .host-badge.mini.neutral{padding:2px 6px;}
  /* Live / Repo / Dashboard – als Link gestylte Pill mit sicherem Tap-Ziel */
  a.host-link,button.host-link{
    display:inline-flex;
    align-items:center;
    min-height:34px;
    padding:0 13px;
    text-decoration:none;
    font-size:12.5px;
  }
  .host-edit{
    background:none;
    border:none;
    color:var(--paper-text-dim);
    cursor:pointer;
    font-size:15px;
    line-height:1;
    padding:8px 10px;
    border-radius:3px;
    transition:color .12s ease, background .12s ease;
  }
  .host-edit:active{background:var(--ink-bg);color:var(--paper-text);}
  @media (hover:hover) and (pointer:fine){
    .host-edit:hover{color:var(--paper-text);background:var(--ink-bg);}
  }
  .host-note{
    font-size:12px;
    line-height:1.5;
    color:var(--paper-text-dim);
    margin:9px 0 0;
    word-break:break-word;
  }

  /* Hosting-Dialog */
  .hg-hint{font-size:12.5px;line-height:1.55;color:var(--paper-text-dim);margin:0 0 18px;}
  .hg-sub{font-size:12px;line-height:1.5;color:var(--paper-text-dim);margin:9px 0 0;}
  .hg-detect-row{display:flex;gap:10px;align-items:flex-start;}
  .hg-detect-row input[type=text]{flex:1;min-width:0;}
  .hg-status{
    font-size:13px;line-height:1.55;margin:14px 0 0;
    padding:12px 14px;border-radius:4px;
    background:var(--ink-bg);border:1px solid var(--hairline);
    color:var(--paper-text-dim);word-break:break-word;
  }
  .hg-status.err{border-color:var(--danger);color:var(--paper-text);}
  .hg-status.ok{border-color:var(--sage-dim);color:var(--paper-text);}
  .hg-section{
    margin-top:26px;padding-top:22px;border-top:1px solid var(--hairline);
  }
  .hg-section > .section-label{margin:0 0 16px;}
  /* Ausklappbarer JSON-Bereich */
  .hg-json{margin-top:24px;border-top:1px solid var(--hairline);padding-top:18px;}
  .hg-json summary{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--paper-text-dim);cursor:pointer;
    list-style:none;padding:10px 0;
  }
  .hg-json summary::-webkit-details-marker{display:none;}
  .hg-json summary::before{content:'▸ ';}
  .hg-json[open] summary::before{content:'▾ ';}
  .hg-json summary:hover{color:var(--paper-text);}
  .hg-json textarea{font-family:'IBM Plex Mono',monospace;font-size:13px;min-height:120px;}

  /* Repo-Auswahl: scrollbare Liste mit grossen Tap-Zeilen */
  .rp-filter{margin-bottom:10px;}
  .rp-list{
    max-height:44vh;overflow-y:auto;
    border:1px solid var(--hairline);border-radius:4px;
    background:var(--ink-bg);
  }
  .rp-row{
    display:flex;align-items:center;gap:10px;
    width:100%;text-align:left;
    background:none;border:none;border-bottom:1px solid var(--hairline);
    color:var(--paper-text);font-family:'Inter',sans-serif;font-size:14.5px;
    padding:14px 15px;min-height:52px;cursor:pointer;
    transition:background .12s ease;
  }
  .rp-row:last-child{border-bottom:none;}
  .rp-row:active{background:var(--ink-bg-raised2);}
  @media (hover:hover) and (pointer:fine){
    .rp-row:hover{background:var(--ink-bg-raised);}
  }
  .rp-name{flex:1;min-width:0;word-break:break-word;}
  .rp-tag{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--paper-text-dim);
    border:1px solid var(--hairline);border-radius:3px;padding:3px 7px;
    flex-shrink:0;white-space:nowrap;
  }
  .rp-tag.privat{color:var(--brass);border-color:var(--brass-dim);}
  .rp-tag.hat{color:var(--sage);border-color:var(--sage-dim);}

  /* Token-Dialog */
  .gh-steps{font-size:13px;line-height:1.65;color:var(--paper-text-dim);margin:0 0 20px;padding-left:20px;}
  .gh-steps li{margin-bottom:7px;}
  .gh-steps strong{color:var(--paper-text);}
  .gh-steps code{
    background:var(--ink-bg);padding:1px 6px;border-radius:3px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--brass);
  }
  .gh-state{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    font-size:13px;margin-bottom:18px;
  }
  /* Startseite: GitHub-Bereich */
  .gh-home{margin-bottom:48px;}
  .gh-home .rp-list{max-height:none;}

  /* Konzept / Prompt: Popup */
  .modal.wide{max-width:680px;}
  .modal.wide .modal-actions{flex-wrap:wrap;}

  /* Sticky Kopfzeile mit Titel + Kopieren-Button (bleibt beim Scrollen sichtbar) */
  .cp-head{
    position:sticky;
    top:0;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:var(--ink-bg-raised);
    border-bottom:1px solid var(--hairline);
    margin:-28px -28px 20px;
    padding:18px 28px;
  }
  .cp-head h2{margin:0;}
  .cp-copy-head{
    height:44px;
    min-width:44px;
    padding:0 16px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    flex-shrink:0;
    font-size:13px;
  }
  .cp-copy-head .cp-copy-ico{font-size:16px;line-height:1;}
  .cp-copy-head.copied{background:var(--sage);color:#1b1d21;}
  .cp-copy-head.failed{background:var(--danger);color:#f4efe9;}

  .cp-meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    line-height:1.5;
    color:var(--paper-text-dim);
    margin:0 0 20px;
    word-break:break-word;
  }
  .cp-content{
    max-height:55vh;
    overflow-y:auto;
    white-space:pre-wrap;
    word-break:break-word;
    font-size:14.5px;
    line-height:1.6;
  }
  .cp-content.prompt{
    font-family:'IBM Plex Mono',monospace;
    font-size:13.5px;
    background:var(--ink-bg);
    padding:16px;
    border-radius:4px;
  }
  .cp-content.placeholder{color:var(--paper-text-dim);font-style:italic;}
  .cp-content textarea{margin:0;}

  footer{
    margin-top:60px;padding-top:20px;border-top:1px solid var(--hairline);
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--paper-text-dim);text-align:center;
  }

  /* Hinweis „Zum Home-Bildschirm“ – erscheint nur in iOS-Safari, solange die
     App nicht installiert ist. Ohne Installation kann iOS keine
     Benachrichtigungen zustellen. */
  #ioshint{max-width:var(--wrap-max);margin:0 auto;padding:14px 18px 0;}
  #ioshint:empty{display:none;}
  .ios-hint{
    display:flex;align-items:flex-start;gap:12px;
    background:var(--ink-bg-raised);
    border:1px solid var(--brass-dim);
    border-radius:4px;
    padding:14px 16px;
    font-size:13px;line-height:1.55;
    color:var(--paper-text-dim);
  }
  .ios-hint strong{color:var(--paper-text);}
  .ios-hint .ios-hint-text{flex:1;min-width:0;}
  .ios-hint button{
    background:none;border:none;color:var(--paper-text-dim);
    font-size:17px;line-height:1;cursor:pointer;
    padding:6px 8px;margin:-6px -8px 0 0;border-radius:3px;flex-shrink:0;
  }
  .ios-hint button:active{background:var(--ink-bg);color:var(--paper-text);}

  .setup-banner{
    background:var(--ink-bg-raised);
    border:1px solid var(--brass-dim);
    border-radius:4px;
    padding:20px 22px;margin-bottom:36px;
    font-size:13.5px;line-height:1.6;color:var(--paper-text-dim);
  }
  .setup-banner strong{color:var(--paper-text);}
  .setup-banner code{
    background:var(--ink-bg);padding:1px 6px;border-radius:3px;
    font-family:'IBM Plex Mono',monospace;color:var(--brass);
  }

  /* Anmeldung */
  .login-screen{
    min-height:70vh;
    display:flex; align-items:center; justify-content:center;
  }
  .login-card{
    background:var(--ink-bg-raised);
    border:1px solid var(--hairline);
    border-left:3px solid var(--brass);
    border-radius:5px;
    padding:34px 32px;
    width:100%; max-width:420px;
    text-align:center;
  }
  .login-card h1{font-size:26px;margin:0 0 10px;}
  .login-card .sub{margin-bottom:26px;}
  .google-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:11px;
    width:100%; height:50px;
    background:var(--paper-text); color:#1b1d21;
    border:none; border-radius:3px;
    font-family:'Inter',sans-serif; font-weight:600; font-size:15px;
    cursor:pointer; transition:opacity .15s ease;
  }
  .google-btn:hover{opacity:.88;}
  .google-btn:disabled{opacity:.5;cursor:default;}
  .google-btn svg{width:18px;height:18px;flex-shrink:0;}
  .login-err{
    margin-top:18px; font-size:13px; line-height:1.55;
    color:var(--danger); text-align:left;
  }
  .login-err code{
    background:var(--ink-bg); padding:1px 5px; border-radius:3px;
    font-family:'IBM Plex Mono',monospace;
  }

  /* Navigation · ab 901 px dauerhaft sichtbar, darunter als Burger-Menü.
     Die Leiste lässt rechts Platz für die userbar, damit sich beide nicht
     überdecken. */
  #mainnav{
    position:fixed;top:0;left:0;right:0;z-index:30;
    background:var(--ink-bg-raised);
    border-bottom:1px solid var(--hairline);
  }
  #mainnav:empty{display:none;}
  body.with-nav{padding-top:53px;}
  /* Ohne Navigation klebte der Inhalt an der userbar – mit Leiste darf oben
     weniger Luft sein. */
  body.with-nav .wrap{padding-top:32px;}
  .nav-inner{
    display:flex;align-items:center;gap:8px;
    height:52px;padding:0 16px 0 16px;
    padding-right:360px;          /* reservierter Platz für die userbar */
  }
  .nav-links{display:flex;align-items:center;gap:2px;overflow:hidden;}
  .nav-link{
    display:inline-flex;align-items:center;
    height:36px;padding:0 13px;border-radius:3px;
    font-family:'Inter',sans-serif;font-size:14px;
    color:var(--paper-text-dim);text-decoration:none;white-space:nowrap;
    transition:color .12s ease, background .12s ease;
  }
  .nav-link:hover{color:var(--paper-text);background:var(--ink-bg);}
  .nav-link.active{color:var(--brass);background:var(--ink-bg);}
  .nav-burger{
    display:none;
    background:none;
    border:1px solid var(--hairline);
    border-radius:3px;
    width:44px;height:44px;padding:0;cursor:pointer;
    flex-direction:column;align-items:center;justify-content:center;gap:5px;
  }
  .nav-burger .nav-bar{
    display:block;width:20px;height:2px;border-radius:1px;
    background:var(--paper-text-dim);
  }
  .nav-burger:active{background:var(--ink-bg);}
  /* Overlay-Menü (Handy) */
  .nav-overlay{
    position:fixed;inset:0;z-index:60;
    background:rgba(10,11,13,.72);
    display:flex;align-items:flex-start;justify-content:flex-start;
    padding:64px 16px 20px;
  }
  .nav-panel{
    background:var(--ink-bg-raised);
    border:1px solid var(--hairline);
    border-radius:8px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    width:100%;max-width:320px;padding:8px;
  }
  .nav-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--paper-text-dim);
    margin:0;padding:10px 14px 8px;
  }
  .nav-item{
    display:flex;align-items:center;
    min-height:48px;              /* sicher treffbare Tap-Fläche */
    padding:0 14px;border-radius:4px;
    font-family:'Inter',sans-serif;font-size:16px;
    color:var(--paper-text);text-decoration:none;
  }
  .nav-item.active{color:var(--brass);}
  .nav-item:active{background:var(--ink-bg);}
  /* Mit sechs Einträgen wird es bei knapp 901 px eng: dort verschwindet
     die Mail-Adresse aus der userbar, dann genügt ein schmalerer Rand. */
  @media (max-width:1150px){
    .nav-inner{padding-right:150px;}
    #userbar .ub-mail{display:none;}
  }
  @media (max-width:900px){
    .nav-inner{padding-right:16px;padding-left:12px;}
    .nav-links{display:none;}
    .nav-burger{display:flex;}
  }

  /* Konto-Leiste oben rechts */
  #userbar{
    position:fixed; top:0; right:0; z-index:40;

<div id="splash" role="status" aria-label="Wird geladen">
  <div class="splash-inner">
    <img id="splash-logo" alt="">
    <div class="splash-bar"><div class="splash-bar-fill" id="splash-fill"></div></div>
  </div>
</div>
<script>
/* Steuerung des Ladescreens.
   Bewusst ein klassisches Skript direkt im Body statt im Modul: es läuft
   sofort beim Parsen, also lange bevor Firebase über das Netz geladen ist.
   Keine Bibliothek, kein Build-Schritt – passend zum Rest der App. */
(function(){
  var splash = document.getElementById('splash');
  var fill   = document.getElementById('splash-fill');
  var logo   = document.getElementById('splash-logo');
  if(!splash || !fill) return;

  // Logo aus dem bereits im Head eingebetteten Icon übernehmen: kein
  // zweiter Base64-Block in der Datei und keine Netzwerkanfrage, das
  // Bild steht damit garantiert beim ersten Paint.
  var quelle = document.querySelector('link[rel="apple-touch-icon"]')
            || document.querySelector('link[rel="icon"]');
  if(quelle && logo) logo.src = quelle.href;

  document.body.classList.add('splash-an');

  var MIN_MS    = 2500;    // Mindestdauer, auch wenn sofort alles da ist
  var FADE_MS   = 500;     // Ausblenden
  var NOTBREMSE = 12000;   // hakt etwas, wird trotzdem freigegeben
  var DECKEL    = 0.92;    // vor der Freigabe nie weiter als hierhin

  var start   = Date.now();
  var gezeigt = 0;
  var raus    = false;

  // Meilensteine mit Gewicht. Der Balken bildet ab, wie viele davon
  // erledigt sind; die letzten Prozent laufen erst, wenn alle stehen.
  var schritte = { fonts:2, firebase:3, auth:2, daten:3 };
  var erledigt = {};
  var gesamt = 0;
  for(var k in schritte) gesamt += schritte[k];

  function anteil(){
    var s = 0;
    for(var n in erledigt) s += schritte[n] || 0;
    return s / gesamt;
  }
  function allesDa(){
    for(var n in schritte) if(!erledigt[n]) return false;
    return true;
  }
  function melde(name){
    if(schritte[name]) erledigt[name] = true;
  }
  function alles(){
    for(var n in schritte) erledigt[n] = true;
  }

  function freigeben(){
    if(raus) return;
    raus = true;
    splash.classList.add('weg');
    document.body.classList.remove('splash-an');
    setTimeout(function(){ if(splash.parentNode) splash.parentNode.removeChild(splash); },
               FADE_MS + 80);
  }

  function schleife(){
    var t = Math.min(1, (Date.now()-start) / MIN_MS);
    // Weicher Verlauf, der den Deckel genau nach MIN_MS erreicht.
    var ausZeit  = (1 - Math.pow(1-t,3)) * DECKEL;
    var ausLaden = anteil() * DECKEL;
    // Das Kleinere gewinnt: ist alles sofort da, gibt die Zeit den Takt
    // vor; lädt etwas langsam, zeigt der Balken den echten Fortschritt.
    var ziel = Math.min(ausZeit, ausLaden);
    if(allesDa() && t >= 1) ziel = 1;

    // Nur vorwärts – der Balken springt nie zurück.
    if(ziel > gezeigt){
      gezeigt = Math.min(ziel, gezeigt + (ziel-gezeigt)*0.18 + 0.004);
    }
    fill.style.width = (gezeigt*100).toFixed(2) + '%';

    if(gezeigt >= 0.999){ freigeben(); return; }
    requestAnimationFrame(schleife);
  }
  requestAnimationFrame(schleife);

  // Schriften: der Ladescreen kommt ohne Webschrift aus, die App nicht.
  // Erst freigeben, wenn sie da sind – sonst wechselt hinterher sichtbar
  // die Schrift und das Layout verrutscht.
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){ melde('fonts'); },
                              function(){ melde('fonts'); });
  } else {
    melde('fonts');
  }

  // Notbremse: ein zu früh freigegebener Ladescreen ist deutlich besser
  // als einer, der ewig stehen bleibt.
  setTimeout(alles, NOTBREMSE);

  window.__splash = { melde: melde, alles: alles };
})();
</script>

  const ICONS  = ["📋","📱","💡","💰","💪","🌐","🤖","📊","🎯","🧭","🎨","🔧","📚","⚙️","🩺","🗂️","✨","🚀"];

  const app = document.getElementById('app');
  const checkIcon = `<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 8.5L6 12L13.5 4" stroke="#1b1d21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  // ── kleine DOM-Helfer ──────────────────────────────────────
  function el(tag, props={}, children=[]){
    const n = document.createElement(tag);
    for(const [k,v] of Object.entries(props)){
      if(k==='class') n.className=v;
      else if(k==='text') n.textContent=v;
      else if(k==='html') n.innerHTML=v;
      else if(k.startsWith('on') && typeof v==='function') n.addEventListener(k.slice(2).toLowerCase(),v);
      else if(v!==undefined && v!==null) n.setAttribute(k,v);
    }
    (Array.isArray(children)?children:[children]).forEach(c=>{
      if(c==null) return;
      n.appendChild(typeof c==='string'?document.createTextNode(c):c);
    });
    return n;
  }
  function fmtDate(ts){
    if(!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'}) + ' · ' +
           d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  }
  function describeError(err){
    const code = (err && err.code ? String(err.code) : '').replace(/^firestore\//,'');
    if(code==='permission-denied' || code==='unauthenticated')
      return 'Zugriff verweigert ('+code+') – dieses Konto ist in den Firestore-Regeln nicht freigeschaltet.';
    if(code==='unavailable')
      return 'Datenbank nicht erreichbar (unavailable) – Internetverbindung prüfen.';
    if(code==='failed-precondition')
      return 'Fehlender Index (failed-precondition) – siehe Firebase-Konsole.';
    return 'Verbindungsfehler'+(code?(' ('+code+')'):'')+' – Konfiguration prüfen.';
  }

  // ── Ladescreen ─────────────────────────────────────────────
  // Meldet einen Meilenstein an das Steuerskript im Body. Fehlt es (etwa
  // weil jemand nur diesen Modulteil testet), passiert schlicht nichts.
  function splashMelde(name){
    try{ if(window.__splash) window.__splash.melde(name); }catch(e){}
  }
  function splashAlles(){
    try{ if(window.__splash) window.__splash.alles(); }catch(e){}
  }

  // ── Konfiguration prüfen ───────────────────────────────────
  const isConfigured = firebaseConfig.apiKey && firebaseConfig.apiKey !== "DEIN_API_KEY";
  if(!isConfigured){
    splashAlles();     // sonst bliebe der Ladescreen über der Fehlermeldung stehen
    app.appendChild(el('header',{class:'app-head'},[
      el('p',{class:'eyebrow',text:'Geteiltes Protokoll'}),
      el('h1',{text:'Verbesserungsprotokoll'}),
      el('p',{class:'sub',html:'<span class="status-dot offline"></span>Nicht konfiguriert'})
    ]));
    app.appendChild(el('div',{class:'setup-banner',html:
      '<strong>Einrichtung nötig:</strong> Bevor die App funktioniert, muss im Code (Abschnitt <code>firebaseConfig</code>) ein eigenes Firebase-Projekt eingetragen werden.'}));
    throw new Error('not configured');
  }

  const fb = initializeApp(firebaseConfig);
  const db = getFirestore(fb);
  const auth = getAuth(fb);
  const googleProvider = new GoogleAuthProvider();
  // Ohne diesen Parameter meldet Google stillschweigend das zuletzt benutzte Konto
  // wieder an. So erscheint bei jeder Anmeldung die Kontoauswahl, und ein Wechsel
  // auf ein anderes Google-Konto ist ueberhaupt erst moeglich.
  googleProvider.setCustomParameters({ prompt:'select_account' });
  splashMelde('firebase');   // Modul geladen, Firebase steht

  const projectsRef = collection(db,'projects');
  const ideasRef    = collection(db,'appIdeas');
  const todosRef    = collection(db,'todos');
  const promptsRef  = collection(db,'savedPrompts');
  const savedFilesRef = collection(db,'savedFiles');
  const pushTokensRef = collection(db,'pushTokens');

  function entriesRefFor(project){
    return project.legacyCollection
      ? collection(db, project.legacyCollection)
      : collection(db,'projects',project.id,'entries');
  }
  function entryDocFor(project,id){
    return project.legacyCollection
      ? doc(db, project.legacyCollection, id)
      : doc(db,'projects',project.id,'entries',id);
  }

  // ── Bestehendes Protokoll als Standard-Projekt sichern ─────
  async function ensureLegacyProject(){
    try{
      const ref = doc(db,'projects',LEGACY_PROJECT_ID);
      const snap = await getDoc(ref);
      if(!snap.exists()){
        await setDoc(ref,{
          name:'Verbesserungsprotokoll',
          color:'#c08552',
          icon:'📋',
          legacyCollection:LEGACY_COLLECTION,
          order:0,
          createdAt:serverTimestamp()
        });
      }
    }catch(err){ console.error('Legacy-Projekt konnte nicht angelegt werden:',err); }
  }

  // ── Router ────────────────────────────────────────────────
  let unsubs = [];
  let projectsCache = [];
  let ideasCache = [];
  let todosCache = [];         // To-dos, nach order sortiert
  let promptsCache = [];       // gespeicherte Prompts, nach order sortiert
  let savedFilesCache = [];    // gespeicherte Dateien, nach order sortiert
  let signedIn = false;        // wird vom Auth-Gate am Dateiende gesetzt
  let ideasUnlocked = false;   // App-Ideen erst nach Code-Eingabe sichtbar (nur diese Sitzung)

  // Priorisierung der offenen Aufgaben im aktuell geöffneten Projekt
  // (analog zu projectsCache / ideasCache – es ist immer nur ein Projekt sichtbar).
  let openEntriesCache   = [];                 // offene Aufgaben, nach order sortiert
  let openEntriesProject = null;               // Projekt, zu dem der Cache gehört
  let openEntriesRepaint = ()=>{};             // zeichnet den Bereich neu (optimistisches UI)
  let openEntriesQueue   = Promise.resolve();  // serialisiert Firestore-Updates (kein Race bei Schnellklicks)

  // Zeichnet den GitHub-Bereich der Startseite neu. Wird auch aufgerufen, wenn
  // der Token erst nach dem ersten Rendern geladen ist.
  let githubHomeRepaint = ()=>{};

  function track(fn){ if(fn) unsubs.push(fn); }
  function cleanup(){
    unsubs.forEach(fn=>{ try{fn();}catch(e){} }); unsubs=[];
    githubHomeRepaint = ()=>{};   // gehört zur alten Ansicht
  }

  // ── Navigation ────────────────────────────────────────────
  // Jeder Bereich ist eine eigene Seite. Ab 901 px steht die Leiste dauerhaft
  // oben, darunter öffnet ein Burger-Button ein Overlay-Menü.
  const NAV_ITEMS = [
    {hash:'#/',        label:'Projekte'},
    {hash:'#/todos',   label:'To-dos'},
    {hash:'#/ideen',   label:'App-Ideen'},
    {hash:'#/prompts', label:'Prompts'},
    {hash:'#/dateien', label:'Dateien'},
    {hash:'#/einstellungen', label:'Einstellungen'}
  ];
  const navEl = document.getElementById('mainnav');
  let navMenuClose = null;     // schliesst das offene Overlay-Menü

  // Die Projektansicht gehört zum Punkt „Projekte“, alles Unbekannte auch.
  function navActiveHash(){
    const h = location.hash || '#/';
    if(/^#\/project\//.test(h)) return '#/';
    return NAV_ITEMS.some(i=>i.hash===h) ? h : '#/';
  }

  function renderNav(){
    navEl.innerHTML='';
    document.body.classList.toggle('with-nav', signedIn);
    if(!signedIn) return;
    const active = navActiveHash();
    const links = el('div',{class:'nav-links'},
      NAV_ITEMS.map(it=> el('a',{class:'nav-link'+(it.hash===active?' active':''),
        href:it.hash, text:it.label})));
    const burger = el('button',{class:'nav-burger',type:'button',
      title:'Menü','aria-label':'Menü öffnen'},[
        el('span',{class:'nav-bar'}),
        el('span',{class:'nav-bar'}),
        el('span',{class:'nav-bar'})
      ]);
    burger.addEventListener('click',openNavMenu);
    navEl.appendChild(el('div',{class:'nav-inner'},[burger,links]));
  }

  function closeNavMenu(){ if(navMenuClose) navMenuClose(); }

  // Schliesst bei Auswahl, bei Klick daneben und mit Escape.
  function openNavMenu(){
    closeNavMenu();
    const active = navActiveHash();
    const overlay = el('div',{class:'nav-overlay'});
    const panel = el('div',{class:'nav-panel'},[el('p',{class:'nav-eyebrow',text:'Bereiche'})]);

    function close(){
      document.removeEventListener('keydown',onKey);
      overlay.remove();
      navMenuClose = null;
    }
    function onKey(e){ if(e.key==='Escape'){ e.preventDefault(); close(); } }

    NAV_ITEMS.forEach(it=>{
      const a = el('a',{class:'nav-item'+(it.hash===active?' active':''),
        href:it.hash, text:it.label});
      a.addEventListener('click',close);
      panel.appendChild(a);
    });
    overlay.appendChild(panel);
    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) close(); });
    document.addEventListener('keydown',onKey);
    document.body.appendChild(overlay);
    navMenuClose = close;
  }

  // Kopfbereich im Stil der bestehenden Ansichten (Eyebrow, Titel, Status).
  function buildSectionHead(eyebrow,title){
    const statusDot  = el('span',{class:'status-dot'});
    const statusText = el('span',{text:'Verbindung wird hergestellt …'});
    const header = el('header',{class:'app-head'},[
      el('p',{class:'eyebrow',text:eyebrow}),
      el('h1',{text:title}),
      el('p',{class:'sub'},[statusDot,statusText])
    ]);
    return {header,statusDot,statusText};
  }
  // Kleiner Adapter, den die subscribe…-Funktionen für die Status-Zeile nutzen.
  function statusHandlers(dot,text){
    return {
      ok(){ dot.classList.remove('offline'); text.textContent='Verbunden · Live-Synchronisierung aktiv'; },
      fail(err){ console.error(err); dot.classList.add('offline'); text.textContent=describeError(err); }
    };
  }
  function buildFooter(){
    return el('footer',{text:'Alle Änderungen werden automatisch über die Datenbank synchronisiert und dauerhaft gespeichert.'});
  }

  function router(){
    cleanup();
    closeNavMenu();
    const hash = location.hash || '#/';
    const m = hash.match(/^#\/project\/(.+)$/);
    // Projektansicht bekommt die breite Spalte (siehe .wrap.view-project)
    app.classList.toggle('view-project', !!m);
    renderNav();
    if(m)                       renderProject(decodeURIComponent(m[1]));
    else if(hash==='#/todos')   renderTodos();
    else if(hash==='#/ideen')   renderIdeen();
    else if(hash==='#/prompts') renderPrompts();
    else if(hash==='#/dateien') renderSavedFilesView();
    else if(hash==='#/einstellungen') renderSettings();
    else                        renderHome();
    window.scrollTo(0,0);
  }
  // Abgemeldet bleibt der Anmeldeschirm stehen, auch wenn sich der Hash ändert
  window.addEventListener('hashchange', ()=>{ if(signedIn) router(); });

  // ══════════════════════════════════════════════════════════
  //  ANSICHT 1 · PROJEKTÜBERSICHT (Startseite)

  function renderHome(){
    app.innerHTML='';

    const statusDot = el('span',{class:'status-dot'});
    const statusText = el('span',{text:'Verbindung wird hergestellt …'});
    app.appendChild(el('header',{class:'app-head'},[

    app.appendChild(el('p',{class:'section-label',text:'Projekte'}));

    app.appendChild(grid);
